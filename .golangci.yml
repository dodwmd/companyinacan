version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - ineffassign
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
