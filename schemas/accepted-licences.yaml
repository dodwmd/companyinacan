# SPDX identifiers accepted for wrapped third-party apps (Constitution VI).
# Anything else must be marked `licence_class: source-available` in the module
# manifest, which makes it opt-in and flagged. AGPL-3.0 and EUPL-1.2 are network copyleft: wrapped
# unmodified they do not reach this repository's Apache-2.0 code, but a modified fork we ship must
# offer its source to the users of the running service (see modules/README.md). Changes here are reviewed like code.
schema: 1
accepted:
  - id: Apache-2.0
  - id: MIT
  - id: BSD-2-Clause
  - id: BSD-3-Clause
  - id: ISC
  - id: 0BSD
  - id: Unlicense
  - id: MPL-2.0
  - id: LGPL-2.1-only
  - id: LGPL-2.1-or-later
  - id: LGPL-3.0-only
  - id: LGPL-3.0-or-later
  - id: GPL-2.0-only
  - id: GPL-2.0-or-later
  - id: GPL-3.0-only
  - id: GPL-3.0-or-later
  - id: AGPL-3.0-only
  - id: AGPL-3.0-or-later
  # EUPL-1.2 (GoatCounter): OSI-approved copyleft that also covers use over a network; its appendix
  # lists AGPL-3.0 as a compatible licence.
  - id: EUPL-1.2
