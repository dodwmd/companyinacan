# can-core in the can-system namespace (epic E03). Apply after deploy/base:
#   kubectl apply -k deploy/can-core
# The image reference is `can-core:dev` for `make dev` (build it with deploy/can-core/Dockerfile and
# `k3d image import`); a release replaces it with a digest-pinned ghcr.io reference (kustomize `images:`).
#
# Why this is not in deploy/base: base is applied by `can dev up` before any image exists, and a
# Deployment whose image cannot be pulled would sit in ImagePullBackOff on every fresh cluster.
#
# Sizing (specs/005-can-core-mvp/measurements.md): 38 MB idle, 55 MB after Argon2 logins. Request
# 48 MiB (the declared ram_mb), limit 96 MiB (ram_limit_mb), soft Go limit 64 MiB (CAN_MEMLIMIT_MB).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: can-core-data
  namespace: can-system
  labels: {app.kubernetes.io/name: can-core, app.kubernetes.io/part-of: companyinacan}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
# Backup dumps (epic E08b, specs/037-backup-dumps): can-core writes consistent dumps and the
# completion marker to the host directory the backup timer reads, /var/lib/can/dumps, through a
# static volume an administrator declares. The pod mounts only a PersistentVolumeClaim, so Pod
# Security (which forbids hostPath volumes in pod specs) stays in force, and can-core has no
# permission to create volumes. The directory must be owned by uid 65532 (host bootstrap does
# that); DirectoryOrCreate would make it root-owned, and dump runs would then fail and say so.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: can-dumps
  labels: {app.kubernetes.io/name: can-core, app.kubernetes.io/part-of: companyinacan}
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: {namespace: can-system, name: can-dumps}
  hostPath: {path: /var/lib/can/dumps, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: can-dumps
  namespace: can-system
  labels: {app.kubernetes.io/name: can-core, app.kubernetes.io/part-of: companyinacan}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: can-dumps
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: can-core
  namespace: can-system
  labels: {app.kubernetes.io/name: can-core, app.kubernetes.io/part-of: companyinacan}
spec:
  selector: {app.kubernetes.io/name: can-core}
  ports:
    - {name: admin, port: 8080, targetPort: admin}
    # The module API; reachable from module namespaces only (allow-module-api-from-modules).
    - {name: module, port: 8090, targetPort: module}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: can-core
  namespace: can-system
  labels: {app.kubernetes.io/name: can-core, app.kubernetes.io/part-of: companyinacan}
spec:
  replicas: 1
  # One writer on the SQLite file: never two pods at once, even during a rollout.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: can-core}
  template:
    metadata:
      labels: {app.kubernetes.io/name: can-core, app.kubernetes.io/part-of: companyinacan}
    spec:
      serviceAccountName: can-core
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: can-core
          image: can-core:dev
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - {name: admin, containerPort: 8080}
            - {name: module, containerPort: 8090}
          env:
            - {name: CAN_ADMIN_ADDR, value: ":8080"}
            - {name: CAN_MODULE_ADDR, value: ":8090"}
            - {name: CAN_DB_PATH, value: /var/lib/can/state.db}
            # Nightly dumps at 02:30 UTC (CAN_DUMP_AT), before the host timer's 03:30.
            - {name: CAN_DUMPS_DIR, value: /var/lib/can-dumps}
            - {name: CAN_TOKEN_REVIEW, value: kubernetes}
            - {name: CAN_PLATFORM_URL, value: "http://can-core.can-system.svc.cluster.local:8090"}
            # Behind Traefik (the only route to the admin port, externalTrafficPolicy: Local): see
            # specs/005-can-core-mvp/deployment.md. Without a proxy in front this MUST be false.
            - {name: CAN_TRUST_PROXY, value: "true"}
            - {name: CAN_COOKIE_SECURE, value: "true"}
            - {name: CAN_MEMLIMIT_MB, value: "64"}
            # The declared RAM request in bytes: exported as can_ram_declared_bytes next to can_ram_rss_bytes
            # (the Constitution II footprint self-check). Metrics themselves stay off until CAN_METRICS_ADDR
            # is set; see docs/observability.md.
            - name: CAN_RAM_DECLARED_BYTES
              valueFrom: {resourceFieldRef: {containerName: can-core, resource: requests.memory, divisor: "1"}}
            - {name: CAN_INSTALLER, value: kubernetes}
            - {name: CAN_COMPANY_FILE, value: /etc/can/company/company.yaml}
            - {name: CAN_MODULES_DIR, value: /modules}
            - {name: CAN_RECONCILE_INTERVAL_SECONDS, value: "15"}
            # The node address, excluded from module egress (deploy/templates/module-namespace.yaml).
            - name: CAN_NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            # Optional: admin connection to the shared Postgres in can-data (database creation).
            - name: CAN_POSTGRES_ADMIN_URL
              valueFrom: {secretKeyRef: {name: can-postgres-admin, key: url, optional: true}}
          resources:
            requests: {memory: 48Mi, cpu: 20m}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            # /readyz: database reachable and migrations applied (503 otherwise). A failing reconcile only
            # reports "degraded" (200), so a cluster problem never takes the admin UI out of rotation.
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/can}
            - {name: dumps, mountPath: /var/lib/can-dumps}
            - {name: tmp, mountPath: /tmp}
            # The applied company.yaml, written by `can apply`. Optional: can-core starts without it.
            - {name: company, mountPath: /etc/can/company, readOnly: true}
            # SSO client secret (docs/sso.md): create the Secret `sso-client` (key client-secret) in
            # can-system and set `client_secret_ref: sso-client` in company.yaml. Optional.
            - {name: sso-client, mountPath: /etc/can/sso/sso-client, readOnly: true}
            # The SMTP relay of email.send (docs/email.md), written by `can up --smtp-credentials-file`,
            # the setup wizard or by hand: keys host, username, password and optionally port, tls, from.
            # Optional; re-read on every send, so no restart is needed.
            - {name: smtp-relay, mountPath: /etc/can/smtp, readOnly: true}
            # The mailbox the support module fetches (docs/support.md), written by
            # `can up --support-imap-credentials-file` or by hand: keys host, username, password and
            # optionally port, encryption, tls_verify. Optional.
            - {name: support-imap, mountPath: /etc/can/support-imap, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: can-core-data}
        - name: dumps
          persistentVolumeClaim: {claimName: can-dumps}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: company
          configMap: {name: company, optional: true}
        - name: sso-client
          secret: {secretName: sso-client, optional: true}
        - name: smtp-relay
          secret: {secretName: can-smtp-relay, optional: true}
        - name: support-imap
          secret: {secretName: can-support-imap, optional: true}
