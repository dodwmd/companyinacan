# The shared Postgres of can-data (SPEC 4.5), applied by can-core the first time an enabled module
# requires `database: postgres` (specs/041-wrapped-modules-live). Not part of deploy/base: a company
# without such a module runs no database server. The superuser password is in Secret
# can-data/can-postgres, generated by can-core and never rotated (the data directory keeps it).
# Footprint: 36 to 50 MB idle measured with two small databases; request 96Mi, limit 256Mi. Tag and
# digest are the multi-arch index of postgres:17.12-alpine; keep the major at or below the
# postgresql client of the hooks image (deploy/hooks), or dumps fail.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: can-data
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: companyinacan, app.kubernetes.io/managed-by: can-core}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: can-data
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: companyinacan, app.kubernetes.io/managed-by: can-core}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: can-data
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: companyinacan, app.kubernetes.io/managed-by: can-core}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: companyinacan}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          args: [-c, shared_buffers=32MB, -c, max_connections=60]
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: can-postgres, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_INITDB_ARGS, value: --auth-host=scram-sha-256}
          resources:
            requests: {memory: 96Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Over TCP: the temporary server the entrypoint runs during initdb listens on the socket only.
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: run
          emptyDir: {sizeLimit: 8Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
