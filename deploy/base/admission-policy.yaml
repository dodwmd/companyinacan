# ValidatingAdmissionPolicies that close the two residual risks of can-core's standing RBAC
# (deploy/base/rbac.yaml): RBAC alone cannot say "bind can-core-module only inside mod-*" or "create
# namespaces only with these labels". Admission can, and it applies to can-core's ServiceAccount
# only, so cluster administrators and k3s itself are unaffected.
#
# Needs Kubernetes 1.30+ (admissionregistration.k8s.io/v1 GA; dev/k3d.yaml pins the k3s release servers get).
# can-core has no permission on these objects (no admissionregistration verbs in its ClusterRole), so
# it cannot weaken them. failurePolicy Fail: if the policy cannot be evaluated, the request is denied.
#
# Proven by test/integration/admission_test.go (a RoleBinding into kube-system is denied).
#
# What this does NOT cover (see specs/005-can-core-mvp/research.md R17): can-core can still update the
# two kube-system objects its Role allows (coredns-custom, HelmChartConfig/traefik), and can create
# any workload inside the mod-* namespaces, which are pod-security `restricted`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [rolebindings]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "request.namespace.startsWith('mod-')"
      message: "can-core may only create RoleBindings in module namespaces (mod-*)"
    - expression: "object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'can-core-module'"
      message: "can-core may only bind the ClusterRole can-core-module"
    - expression: "object.subjects.size() == 1 && object.subjects[0].kind == 'ServiceAccount' && object.subjects[0].name == 'can-core' && object.subjects[0].namespace == 'can-system'"
      message: "the only subject of a can-core RoleBinding is ServiceAccount can-system/can-core"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-rolebindings
spec:
  policyName: can-core-rolebindings
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "object.metadata.name.startsWith('mod-')"
      message: "can-core may only create module namespaces (mod-*)"
    - expression: "has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels && object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'"
      message: "module namespaces must enforce the restricted pod security standard"
    - expression: "has(object.metadata.labels) && 'can.dev/namespace-kind' in object.metadata.labels && object.metadata.labels['can.dev/namespace-kind'] == 'module'"
      message: "module namespaces must carry can.dev/namespace-kind=module (the NetworkPolicies select on it)"
    - expression: "has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce-version' in object.metadata.labels && object.metadata.labels['pod-security.kubernetes.io/enforce-version'].startsWith('v1.')"
      message: "module namespaces must pin pod-security.kubernetes.io/enforce-version (v1.x) so the standard does not drift with the cluster"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-namespaces
spec:
  policyName: can-core-namespaces
  validationActions: [Deny]
---
# What a module may route (specs/040-module-routing). can-core is the only writer of routes in module
# namespaces, so these bound it: even a compromised can-core cannot give a module another module's
# host, the admin host, the apex or a path of the public site that is not the module's. The company
# domain and site hosts come from ConfigMap can-system/can-routing, which the `can` CLI writes and
# can-core may not (can-core-routing-config below). No ConfigMap, no routes.
#
# The tables (which extra label a module may claim, which path on the site is whose) mirror
# core/routing; test/contract/routing_test.go keeps them in step. Proven on a cluster by
# test/integration/routing_k3d_test.go.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-routes
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    # Not matchConditions: a missing parameter is refused before those are looked at, so anything
    # wider would block every route in the cluster (k3s's own Traefik chart included) until
    # can-routing exists. Routes by can-core anywhere else are refused by can-core-routing-config.
    namespaceSelector:
      matchLabels: {can.dev/namespace-kind: module}
    resourceRules:
      - apiGroups: [traefik.io, traefik.containo.us]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [ingressroutes]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  variables:
    - name: id
      expression: "request.namespace.startsWith('mod-') ? request.namespace.substring(4) : ''"
    # core/routing.Aliases: the only labels besides its id a module may claim.
    - name: aliases
      expression: "{'jobs': 'careers', 'provisioning': 'scim', 'analytics': 'stats'}"
    # core/routing.MayClaim: no module claims admin, www or another module's alias as its own id.
    - name: ownHost
      expression: "variables.id in ['', 'admin', 'www', 'careers', 'scim', 'stats'] ? '' : variables.id + '.' + params.data.domain"
    - name: aliasHost
      expression: "variables.id in variables.aliases ? variables.aliases[variables.id] + '.' + params.data.domain : ''"
    # core/routing.SitePrefixes: only forms, only /_forms, only on the site's hosts.
    - name: siteMatches
      expression: "variables.id == 'forms' ? params.data.siteHosts.split(',').filter(h, h != '').map(h, 'Host(`' + h + '`) && PathPrefix(`/_forms`)') : []"
  validations:
    - expression: "request.namespace.startsWith('mod-')"
      message: "can-core may only create routes in module namespaces (mod-*)"
    - expression: "has(object.spec.entryPoints) && object.spec.entryPoints.size() > 0 && object.spec.entryPoints.all(e, e == 'web' || e == 'websecure')"
      message: "a route must name its entry points: web or websecure"
    - expression: |-
        has(object.spec.routes) && object.spec.routes.all(r,
          r.match in variables.siteMatches
          || (variables.id == 'forms' && params.data.catchAll == 'true' && r.match == 'PathPrefix(`/_forms`)')
          || (r.match.matches(r'^Host\(`[a-z0-9.-]+`\)( && (Path|PathPrefix|Method|Headers)\(`[^`]*`(, ?`[^`]*`)?\))*$')
              && r.match.split('`')[1] != 'admin.' + params.data.domain
              && (r.match.split('`')[1] == variables.ownHost || r.match.split('`')[1] == variables.aliasHost)))
      message: "a module may route only its own host (<id>.<domain> or its declared alias); only forms may route /_forms on the site hosts"
    - expression: |-
        has(object.spec.routes) && object.spec.routes.all(r,
          has(r.services) && r.services.all(s,
            !s.name.contains('@') && (!has(s.namespace) || s.namespace == request.namespace) && (!has(s.kind) || s.kind == 'Service'))
          && (!has(r.middlewares) || r.middlewares.all(m, !m.name.contains('@') && (!has(m.namespace) || m.namespace == request.namespace))))
      message: "a route may only use Services and Middlewares of its own namespace"
    - expression: |-
        !has(object.spec.tls) || (!has(object.spec.tls.secretName) && !has(object.spec.tls.domains)
          && !has(object.spec.tls.options) && !has(object.spec.tls.store)
          && (!has(object.spec.tls.certResolver) || object.spec.tls.certResolver == 'letsencrypt'))
      message: "a route may only use the letsencrypt certificate resolver, for its own host"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-routes
spec:
  policyName: can-core-routes
  validationActions: [Deny]
  paramRef:
    name: can-routing
    namespace: can-system
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-routing-config
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
      - apiGroups: [traefik.io, traefik.containo.us]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [ingressroutes]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: >-
        request.resource.resource != 'ingressroutes' || (request.namespace.startsWith('mod-')
        && has(namespaceObject.metadata.labels) && 'can.dev/namespace-kind' in namespaceObject.metadata.labels
        && namespaceObject.metadata.labels['can.dev/namespace-kind'] == 'module')
      message: "can-core may only create routes in module namespaces (mod-*)"
    - expression: "request.resource.resource != 'ingresses'"
      message: "can-core routes with Traefik IngressRoutes only; plain Ingress objects are refused"
    - expression: |-
        !(request.resource.resource == 'configmaps' && request.namespace == 'can-system'
          && (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) == 'can-routing')
      message: "can-core may not write ConfigMap can-system/can-routing: it bounds what can-core may route"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-routing-config
spec:
  policyName: can-core-routing-config
  validationActions: [Deny]
---
# The other way onto the network: can-core may only create cluster-internal Services. k3s's
# ServiceLB would publish a LoadBalancer on the node's own ports, past Traefik and the rules above.
# (The installer refuses these in charts too.)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [services]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "can-core may only create ClusterIP Services (no LoadBalancer, NodePort or ExternalName)"
    - expression: "!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0"
      message: "can-core may not set externalIPs on a Service"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-services
spec:
  policyName: can-core-services
  validationActions: [Deny]
---
# The NetworkPolicies can-core may write in a module namespace (specs/057-module-capability-wiring).
# The ones every module gets admit the platform only (DNS and Traefik, can-core, the databases, the
# internet without the cluster's own ranges) or pods of the same namespace. A policy can-core creates
# or changes may open one module to another only if it is named can-wire-*, for a pair and port listed
# here. It bounds CREATE and UPDATE only: can-core can still delete policies, default-deny included.
# What it allows: the consumer's pods to the
# provider's pods, and nothing else. The pairs mirror core/server/modsecrets.Grants and the
# providers' manifests; test/contract keeps them in step.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-networkpolicies
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {can.dev/namespace-kind: module}
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [networkpolicies]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  variables:
    # consumer>provider:port
    - name: pairs
      expression: "['equity>people:8081', 'provisioning>people:8081']"
    - name: id
      expression: "request.namespace.startsWith('mod-') ? request.namespace.substring(4) : ''"
    - name: wiring
      expression: "object.metadata.name.startsWith('can-wire-')"
    - name: platform
      expression: "['kube-system', 'can-system', 'can-data']"
  validations:
    - expression: |-
        variables.wiring || !has(object.spec.ingress) || object.spec.ingress.all(r,
          has(r.from) && r.from.size() > 0 && r.from.all(p,
            has(p.ipBlock)
              ? has(p.ipBlock.except) && '10.42.0.0/16' in p.ipBlock.except
              : !has(p.namespaceSelector) || (!has(p.namespaceSelector.matchExpressions) && has(p.namespaceSelector.matchLabels)
                  && 'kubernetes.io/metadata.name' in p.namespaceSelector.matchLabels
                  && p.namespaceSelector.matchLabels['kubernetes.io/metadata.name'] in variables.platform)))
      message: "a module may only admit the platform namespaces and its own pods; another module only through a can-wire-* policy"
    - expression: |-
        variables.wiring || !has(object.spec.egress) || object.spec.egress.all(r,
          has(r.to) && r.to.size() > 0 && r.to.all(p,
            has(p.ipBlock)
              ? has(p.ipBlock.except) && '10.42.0.0/16' in p.ipBlock.except
              : !has(p.namespaceSelector) || (!has(p.namespaceSelector.matchExpressions) && has(p.namespaceSelector.matchLabels)
                  && 'kubernetes.io/metadata.name' in p.namespaceSelector.matchLabels
                  && p.namespaceSelector.matchLabels['kubernetes.io/metadata.name'] in variables.platform)))
      message: "a module may only reach the platform namespaces, its own pods and the internet; another module only through a can-wire-* policy"
    # A connection selects the owner's own pods and has exactly one rule, in one direction.
    - expression: |-
        !variables.wiring || (
          has(object.spec.podSelector.matchLabels) && !has(object.spec.podSelector.matchExpressions)
          && object.spec.podSelector.matchLabels == {'app.kubernetes.io/name': variables.id}
          && (has(object.spec.egress) && object.spec.egress.size() > 0) != (has(object.spec.ingress) && object.spec.ingress.size() > 0))
      message: "a can-wire-* policy selects the module's own pods and has rules in one direction only"
    # The consumer's side: egress to the pods of a listed provider, on its port.
    - expression: |-
        !variables.wiring || !has(object.spec.egress) || object.spec.egress.size() == 0 || (
          object.spec.egress.size() == 1
          && has(object.spec.egress[0].to) && object.spec.egress[0].to.size() == 1
          && has(object.spec.egress[0].ports) && object.spec.egress[0].ports.size() == 1
          && has(object.spec.egress[0].ports[0].port) && !has(object.spec.egress[0].ports[0].endPort)
          && !has(object.spec.egress[0].to[0].ipBlock)
          && has(object.spec.egress[0].to[0].namespaceSelector) && has(object.spec.egress[0].to[0].podSelector)
          && has(object.spec.egress[0].to[0].namespaceSelector.matchLabels) && !has(object.spec.egress[0].to[0].namespaceSelector.matchExpressions)
          && has(object.spec.egress[0].to[0].podSelector.matchLabels) && !has(object.spec.egress[0].to[0].podSelector.matchExpressions)
          && variables.pairs.exists(x,
            x.startsWith(variables.id + '>')
            && object.spec.egress[0].to[0].namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': 'mod-' + x.substring(x.indexOf('>') + 1, x.indexOf(':'))}
            && object.spec.egress[0].to[0].podSelector.matchLabels == {'app.kubernetes.io/name': x.substring(x.indexOf('>') + 1, x.indexOf(':'))}
            && string(object.spec.egress[0].ports[0].port) == x.substring(x.indexOf(':') + 1)))
      message: "can-core may only connect a module to the pods and port of a provider it is granted (specs/057)"
    # The provider's side: ingress from the pods of a listed consumer, on the same port.
    - expression: |-
        !variables.wiring || !has(object.spec.ingress) || object.spec.ingress.size() == 0 || (
          object.spec.ingress.size() == 1
          && has(object.spec.ingress[0].from) && object.spec.ingress[0].from.size() == 1
          && has(object.spec.ingress[0].ports) && object.spec.ingress[0].ports.size() == 1
          && has(object.spec.ingress[0].ports[0].port) && !has(object.spec.ingress[0].ports[0].endPort)
          && !has(object.spec.ingress[0].from[0].ipBlock)
          && has(object.spec.ingress[0].from[0].namespaceSelector) && has(object.spec.ingress[0].from[0].podSelector)
          && has(object.spec.ingress[0].from[0].namespaceSelector.matchLabels) && !has(object.spec.ingress[0].from[0].namespaceSelector.matchExpressions)
          && has(object.spec.ingress[0].from[0].podSelector.matchLabels) && !has(object.spec.ingress[0].from[0].podSelector.matchExpressions)
          && variables.pairs.exists(x,
            x.substring(x.indexOf('>') + 1, x.indexOf(':')) == variables.id
            && object.spec.ingress[0].from[0].namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': 'mod-' + x.substring(0, x.indexOf('>'))}
            && object.spec.ingress[0].from[0].podSelector.matchLabels == {'app.kubernetes.io/name': x.substring(0, x.indexOf('>'))}
            && string(object.spec.ingress[0].ports[0].port) == x.substring(x.indexOf(':') + 1)))
      message: "can-core may only admit to a provider the pods of a consumer it is granted, on its port (specs/057)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-networkpolicies
spec:
  policyName: can-core-networkpolicies
  validationActions: [Deny]
---
# The website editor of the admin UI (specs/067-site-editor). Publishing rolls the site (the digest
# annotation of Deployment site's pod template) and rewrites one key of ConfigMap site-content; these
# two policies refuse every other change by can-core to that ConfigMap and to Deployments,
# StatefulSets and DaemonSets here. They do NOT confine can-core in can-system: its RoleBinding still
# lets it write Jobs, CronJobs, Services, NetworkPolicies, Secrets and other ConfigMaps and exec into
# pods there, so a compromised can-core could still change what visitors get (for example with a Job
# pod carrying the site Service's labels, or by editing that Service).
# can-core refuses to publish while either is missing. Proven by test/integration/site_publish_test.go.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-site
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: can-system}
    resourceRules:
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "request.operation == 'UPDATE' && request.resource.resource == 'deployments' && object.metadata.name == 'site'"
      message: "in can-system can-core may only update Deployment site"
    - expression: >-
        request.operation != 'UPDATE' || request.resource.resource != 'deployments' || (
        object.spec.replicas == oldObject.spec.replicas && object.spec.selector == oldObject.spec.selector
        && object.spec.strategy == oldObject.spec.strategy && object.spec.template.spec == oldObject.spec.template.spec
        && object.spec.template.metadata.labels == oldObject.spec.template.metadata.labels
        && (has(object.spec.paused) && object.spec.paused) == (has(oldObject.spec.paused) && oldObject.spec.paused))
      message: "can-core may not change what the site runs"
    - expression: >-
        request.operation != 'UPDATE' || request.resource.resource != 'deployments' || (
        has(object.spec.template.metadata.annotations)
        && object.spec.template.metadata.annotations.all(k, k == 'can.dev/site-sha256'
          || (has(oldObject.spec.template.metadata.annotations) && k in oldObject.spec.template.metadata.annotations
              && oldObject.spec.template.metadata.annotations[k] == object.spec.template.metadata.annotations[k]))
        && (!has(oldObject.spec.template.metadata.annotations)
          || oldObject.spec.template.metadata.annotations.all(k, k in object.spec.template.metadata.annotations)))
      message: "can-core may only change the can.dev/site-sha256 annotation of the site's pods"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-site
spec:
  policyName: can-core-site
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-site-content
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: can-system}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
    - name: is-the-site-content
      expression: "(request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) == 'site-content'"
  validations:
    - expression: "request.operation == 'UPDATE'"
      message: "can-core may only update ConfigMap site-content (`can up` creates it)"
    - expression: >-
        request.operation != 'UPDATE' || ((!has(object.data) || object.data.size() == 0)
        && has(object.binaryData) && object.binaryData.size() == 1 && 'site.tar.gz' in object.binaryData)
      message: "ConfigMap site-content holds the site archive and nothing else"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-site-content
spec:
  policyName: can-core-site-content
  validationActions: [Deny]
