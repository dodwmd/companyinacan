# ValidatingAdmissionPolicies that close the two residual risks of can-core's standing RBAC
# (deploy/base/rbac.yaml): RBAC alone cannot say "bind can-core-module only inside mod-*" or "create
# namespaces only with these labels". Admission can, and it applies to can-core's ServiceAccount
# only, so cluster administrators and k3s itself are unaffected.
#
# Needs Kubernetes 1.30+ (admissionregistration.k8s.io/v1 GA; dev/k3d.yaml pins the k3s release servers get).
# can-core has no permission on these objects (no admissionregistration verbs in its ClusterRole), so
# it cannot weaken them. failurePolicy Fail: if the policy cannot be evaluated, the request is denied.
#
# Proven by test/integration/admission_test.go (a RoleBinding into kube-system is denied).
#
# What this does NOT cover (see specs/005-can-core-mvp/research.md R17): can-core can still update the
# two kube-system objects its Role allows (coredns-custom, HelmChartConfig/traefik), and can create
# any workload inside the mod-* namespaces, which are pod-security `restricted`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [rolebindings]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "request.namespace.startsWith('mod-')"
      message: "can-core may only create RoleBindings in module namespaces (mod-*)"
    - expression: "object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'can-core-module'"
      message: "can-core may only bind the ClusterRole can-core-module"
    - expression: "object.subjects.size() == 1 && object.subjects[0].kind == 'ServiceAccount' && object.subjects[0].name == 'can-core' && object.subjects[0].namespace == 'can-system'"
      message: "the only subject of a can-core RoleBinding is ServiceAccount can-system/can-core"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-rolebindings
spec:
  policyName: can-core-rolebindings
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "object.metadata.name.startsWith('mod-')"
      message: "can-core may only create module namespaces (mod-*)"
    - expression: "has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels && object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'"
      message: "module namespaces must enforce the restricted pod security standard"
    - expression: "has(object.metadata.labels) && 'can.dev/namespace-kind' in object.metadata.labels && object.metadata.labels['can.dev/namespace-kind'] == 'module'"
      message: "module namespaces must carry can.dev/namespace-kind=module (the NetworkPolicies select on it)"
    - expression: "has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce-version' in object.metadata.labels && object.metadata.labels['pod-security.kubernetes.io/enforce-version'].startsWith('v1.')"
      message: "module namespaces must pin pod-security.kubernetes.io/enforce-version (v1.x) so the standard does not drift with the cluster"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-namespaces
spec:
  policyName: can-core-namespaces
  validationActions: [Deny]
---
# What a module may route (specs/040-module-routing). can-core is the only writer of routes in module
# namespaces, so these bound it: even a compromised can-core cannot give a module another module's
# host, the admin host, the apex or a path of the public site that is not the module's. The company
# domain and site hosts come from ConfigMap can-system/can-routing, which the `can` CLI writes and
# can-core may not (can-core-routing-config below). No ConfigMap, no routes.
#
# The tables (which extra label a module may claim, which path on the site is whose) mirror
# core/routing; test/contract/routing_test.go keeps them in step. Proven on a cluster by
# test/integration/routing_k3d_test.go.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-routes
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    # Not matchConditions: a missing parameter is refused before those are looked at, so anything
    # wider would block every route in the cluster (k3s's own Traefik chart included) until
    # can-routing exists. Routes by can-core anywhere else are refused by can-core-routing-config.
    namespaceSelector:
      matchLabels: {can.dev/namespace-kind: module}
    resourceRules:
      - apiGroups: [traefik.io, traefik.containo.us]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [ingressroutes]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  variables:
    - name: id
      expression: "request.namespace.startsWith('mod-') ? request.namespace.substring(4) : ''"
    # core/routing.Aliases: the only labels besides its id a module may claim.
    - name: aliases
      expression: "{'jobs': 'careers', 'provisioning': 'scim', 'analytics': 'stats'}"
    # core/routing.MayClaim: no module claims admin, www or another module's alias as its own id.
    - name: ownHost
      expression: "variables.id in ['', 'admin', 'www', 'careers', 'scim', 'stats'] ? '' : variables.id + '.' + params.data.domain"
    - name: aliasHost
      expression: "variables.id in variables.aliases ? variables.aliases[variables.id] + '.' + params.data.domain : ''"
    # core/routing.SitePrefixes: only forms, only /_forms, only on the site's hosts.
    - name: siteMatches
      expression: "variables.id == 'forms' ? params.data.siteHosts.split(',').filter(h, h != '').map(h, 'Host(`' + h + '`) && PathPrefix(`/_forms`)') : []"
  validations:
    - expression: "request.namespace.startsWith('mod-')"
      message: "can-core may only create routes in module namespaces (mod-*)"
    - expression: "has(object.spec.entryPoints) && object.spec.entryPoints.size() > 0 && object.spec.entryPoints.all(e, e == 'web' || e == 'websecure')"
      message: "a route must name its entry points: web or websecure"
    - expression: |-
        has(object.spec.routes) && object.spec.routes.all(r,
          r.match in variables.siteMatches
          || (variables.id == 'forms' && params.data.catchAll == 'true' && r.match == 'PathPrefix(`/_forms`)')
          || (r.match.matches(r'^Host\(`[a-z0-9.-]+`\)( && (Path|PathPrefix|Method|Headers)\(`[^`]*`(, ?`[^`]*`)?\))*$')
              && r.match.split('`')[1] != 'admin.' + params.data.domain
              && (r.match.split('`')[1] == variables.ownHost || r.match.split('`')[1] == variables.aliasHost)))
      message: "a module may route only its own host (<id>.<domain> or its declared alias); only forms may route /_forms on the site hosts"
    - expression: |-
        has(object.spec.routes) && object.spec.routes.all(r,
          has(r.services) && r.services.all(s,
            !s.name.contains('@') && (!has(s.namespace) || s.namespace == request.namespace) && (!has(s.kind) || s.kind == 'Service'))
          && (!has(r.middlewares) || r.middlewares.all(m, !m.name.contains('@') && (!has(m.namespace) || m.namespace == request.namespace))))
      message: "a route may only use Services and Middlewares of its own namespace"
    - expression: |-
        !has(object.spec.tls) || (!has(object.spec.tls.secretName) && !has(object.spec.tls.domains)
          && !has(object.spec.tls.options) && !has(object.spec.tls.store)
          && (!has(object.spec.tls.certResolver) || object.spec.tls.certResolver == 'letsencrypt'))
      message: "a route may only use the letsencrypt certificate resolver, for its own host"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-routes
spec:
  policyName: can-core-routes
  validationActions: [Deny]
  paramRef:
    name: can-routing
    namespace: can-system
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-routing-config
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
      - apiGroups: [traefik.io, traefik.containo.us]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [ingressroutes]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: >-
        request.resource.resource != 'ingressroutes' || (request.namespace.startsWith('mod-')
        && has(namespaceObject.metadata.labels) && 'can.dev/namespace-kind' in namespaceObject.metadata.labels
        && namespaceObject.metadata.labels['can.dev/namespace-kind'] == 'module')
      message: "can-core may only create routes in module namespaces (mod-*)"
    - expression: "request.resource.resource != 'ingresses'"
      message: "can-core routes with Traefik IngressRoutes only; plain Ingress objects are refused"
    - expression: |-
        !(request.resource.resource == 'configmaps' && request.namespace == 'can-system'
          && (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) == 'can-routing')
      message: "can-core may not write ConfigMap can-system/can-routing: it bounds what can-core may route"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-routing-config
spec:
  policyName: can-core-routing-config
  validationActions: [Deny]
---
# The other way onto the network: can-core may only create cluster-internal Services. k3s's
# ServiceLB would publish a LoadBalancer on the node's own ports, past Traefik and the rules above.
# (The installer refuses these in charts too.)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: can-core-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [services]
  matchConditions:
    - name: requester-is-can-core
      expression: "request.userInfo.username == 'system:serviceaccount:can-system:can-core'"
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "can-core may only create ClusterIP Services (no LoadBalancer, NodePort or ExternalName)"
    - expression: "!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0"
      message: "can-core may not set externalIPs on a Service"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: can-core-services
spec:
  policyName: can-core-services
  validationActions: [Deny]
