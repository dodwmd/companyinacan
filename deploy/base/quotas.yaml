# Defaults so that no pod runs without requests and limits (SPEC 3.2), plus a ceiling per
# namespace. Charts set their own requests/limits; these apply only where a chart does not.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: can-system
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 32Mi}
      default: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ceiling
  namespace: can-system
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 256Mi
    limits.cpu: "2"
    limits.memory: 768Mi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: can-data
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 128Mi}
      default: {cpu: 1, memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ceiling
  namespace: can-data
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 1536Mi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: can-portal
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 32Mi}
      default: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ceiling
  namespace: can-portal
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 128Mi
    limits.cpu: "1"
    limits.memory: 256Mi
    persistentvolumeclaims: "1"
