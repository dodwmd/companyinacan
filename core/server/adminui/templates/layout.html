{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b5cad">
<title>{{.Title}} - {{t "app.name"}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<a class="skip" href="#main">{{t "a11y.skip"}}</a>
<header class="top">
<p class="brand">{{t "app.name"}}</p>
{{if .User}}<nav aria-label="{{t "nav.label"}}">
<ul>
{{range .Nav}}<li><a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a></li>
{{end}}</ul>
</nav>
<form class="logout" method="post" action="/logout">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button type="submit" class="link">{{t "nav.logout"}} ({{.User}})</button>
</form>{{end}}
</header>
<main id="main" tabindex="-1">
{{if .Flash}}<p class="flash" role="status">{{.Flash}}</p>
{{end}}{{template "content" .}}
</main>
<footer>
<p>{{t "app.footer"}}</p>
</footer>
</body>
</html>
{{end}}
