{{define "content"}}
<p><a href="/settings">{{t "settings.back"}}</a></p>
<h1>{{t "settings.totp_new"}}</h1>
{{if .Data.Error}}<p class="alert err" role="alert">{{.Data.Error}}</p>{{end}}
<p>{{t "settings.totp_scan"}}</p>
<dl>
<dt>{{t "settings.totp_secret"}}</dt><dd><code class="secret">{{.Data.Secret}}</code></dd>
<dt>{{t "settings.totp_uri"}}</dt><dd><code class="secret">{{.Data.URI}}</code></dd>
</dl>
<form method="post" action="/settings/totp/confirm" class="stack">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input type="hidden" name="secret" value="{{.Data.Secret}}">
<p><label for="tc-current">{{t "settings.current"}}</label>
<input id="tc-current" name="current" type="password" autocomplete="current-password" maxlength="1024" required></p>
<p><label for="tc-code">{{t "settings.totp_code"}}</label>
<input id="tc-code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" maxlength="6" required aria-describedby="tc-hint">
<span id="tc-hint" class="hint">{{t "settings.totp_confirm_hint"}}</span></p>
<p><button type="submit">{{t "settings.totp_confirm"}}</button></p>
</form>
{{end}}
