{{define "content"}}
<section class="narrow">
<h1>{{t "su.title"}}</h1>
<p>{{t "su.for" .Data.Username}}</p>
{{if .Data.Error}}<p class="alert err" role="alert">{{.Data.Error}}</p>{{end}}
<h2>{{t "su.step_app"}}</h2>
<dl>
<dt>{{t "su.secret"}}</dt><dd><code>{{.Data.Secret}}</code></dd>
<dt>{{t "su.uri"}}</dt><dd><code>{{.Data.URI}}</code></dd>
</dl>
<h2>{{t "su.step_form"}}</h2>
<form method="post" action="/set-password" class="stack">
<input type="hidden" name="csrf" value="{{.Data.LoginCSRF}}">
<input type="hidden" name="token" value="{{.Data.Token}}">
{{if .Data.KeepPassword}}<p><label for="su-pw">{{t "su.current"}}</label>
<input id="su-pw" name="password" type="password" autocomplete="current-password" maxlength="1024" required></p>
{{else}}<p><label for="su-pw">{{t "su.new"}}</label>
<input id="su-pw" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required aria-describedby="su-hint">
<span id="su-hint" class="hint">{{t "su.new_hint"}}</span></p>
<p><label for="su-confirm">{{t "su.confirm"}}</label>
<input id="su-confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></p>
{{end}}<p><label for="su-otp">{{t "su.code"}}</label>
<input id="su-otp" name="totp" type="text" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" maxlength="6" required></p>
<p><button type="submit">{{t "su.submit"}}</button></p>
</form>
</section>
{{end}}
