{{define "content"}}<h1>{{t "ticket.title"}}</h1>
<p>{{t "ticket.intro"}}</p>
<p>{{t "ticket.account"}} <strong>{{.D.Name}}</strong> (<code>{{.D.Account}}</code>)</p>
<form method="post" action="/ui/login/ticket" class="stack narrow">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input type="hidden" name="ticket" value="{{.D.Ticket}}">
{{if .D.Other}}<p class="flash err" role="alert">{{t "ticket.other"}} <strong>{{.D.Other}}</strong></p>
<p><input id="replace" type="checkbox" name="replace" value="{{.D.Subject}}" required> <label for="replace">{{t "ticket.replace"}}</label></p>
{{end}}<button type="submit">{{t "ticket.submit"}}</button>
</form>
{{end}}
