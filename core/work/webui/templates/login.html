{{define "content"}}<h1>{{t "login.title"}}</h1>
{{if .D.Error}}<p class="flash err" role="alert">{{.D.Error}}</p>
{{end}}{{if .D.TokenLogin}}<p>{{t "login.intro"}}</p>
<form method="post" action="/ui/login" class="stack narrow" autocomplete="off">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input type="hidden" name="next" value="{{.D.Next}}">
<label for="token">{{t "login.token"}}</label>
<input id="token" name="token" type="password" autocomplete="off" required maxlength="512" spellcheck="false" autocapitalize="off" aria-describedby="token-hint">
<p id="token-hint" class="hint">{{t "login.hint"}}</p>
<button type="submit">{{t "login.submit"}}</button>
</form>
{{else}}<p>{{t "login.sso_only"}}</p>
{{end}}{{end}}
