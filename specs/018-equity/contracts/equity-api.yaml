"components":
  "securitySchemes":
    "bearer":
      "type": "http"
      "scheme": "bearer"
      "description": "Service-account token or a user token introspected by can-core."
  "schemas":
    "Error":
      "type": "object"
      "additionalProperties": false
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
      "required":
        - "code"
        - "message"
    "Entity":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^ent_[0-9a-f]{24}$"
        "name":
          "type": "string"
          "maxLength": 200
        "jurisdiction":
          "type": "string"
          "maxLength": 100
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
      "required":
        - "id"
        - "name"
        - "currency"
    "EntityInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "jurisdiction":
          "type": "string"
          "maxLength": 100
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
      "required":
        - "name"
        - "currency"
    "EntityList":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Entity"
      "required":
        - "items"
    "ShareClass":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^cls_[0-9a-f]{24}$"
        "entity_id":
          "type": "string"
          "pattern": "^ent_[0-9a-f]{24}$"
        "name":
          "type": "string"
        "kind":
          "enum":
            - "common"
            - "preferred"
        "par_minor":
          "type": "integer"
          "minimum": 0
          "maximum": 1125899906842624
          "description": "Integer minor units of the currency."
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
        "authorised":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "issued":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
      "required":
        - "id"
        - "entity_id"
        - "name"
        - "kind"
        - "par_minor"
        - "currency"
        - "authorised"
        - "issued"
    "ShareClassInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "kind":
          "enum":
            - "common"
            - "preferred"
        "par_minor":
          "type": "integer"
          "minimum": 0
          "maximum": 1125899906842624
          "description": "Integer minor units of the currency."
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
        "authorised":
          "oneOf":
            -
              "type": "string"
              "pattern": "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
            -
              "type": "number"
              "minimum": 0
          "description": "Exact decimal (string preferred; a JSON number is parsed textually, never as a float). At most 4 decimal places, at most 100 billion."
      "required":
        - "name"
        - "kind"
        - "par_minor"
        - "currency"
        - "authorised"
    "ShareClassList":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ShareClass"
      "required":
        - "items"
    "RaiseAuthorisedRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "authorised":
          "oneOf":
            -
              "type": "string"
              "pattern": "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
            -
              "type": "number"
              "minimum": 0
          "description": "Exact decimal (string preferred; a JSON number is parsed textually, never as a float). At most 4 decimal places, at most 100 billion."
      "required":
        - "authorised"
      "description": "Authorised shares can be raised, never lowered."
    "Plan":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^pln_[0-9a-f]{24}$"
        "entity_id":
          "type": "string"
          "pattern": "^ent_[0-9a-f]{24}$"
        "class_id":
          "type": "string"
          "pattern": "^cls_[0-9a-f]{24}$"
        "name":
          "type": "string"
        "authorised":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "adopted_on":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "status":
          "enum":
            - "active"
            - "closed"
      "required":
        - "id"
        - "entity_id"
        - "class_id"
        - "name"
        - "authorised"
        - "adopted_on"
        - "status"
    "PlanInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "class_id":
          "type": "string"
          "pattern": "^cls_[0-9a-f]{24}$"
        "authorised":
          "oneOf":
            -
              "type": "string"
              "pattern": "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
            -
              "type": "number"
              "minimum": 0
          "description": "Exact decimal (string preferred; a JSON number is parsed textually, never as a float). At most 4 decimal places, at most 100 billion."
        "adopted_on":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      "required":
        - "name"
        - "class_id"
        - "authorised"
        - "adopted_on"
    "PlanList":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Plan"
      "required":
        - "items"
    "PoolStatus":
      "type": "object"
      "additionalProperties": false
      "properties":
        "plan_id":
          "type": "string"
          "pattern": "^pln_[0-9a-f]{24}$"
        "as_of":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "authorised":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "granted_outstanding":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "exercised":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "available":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "pending_approval":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
      "required":
        - "plan_id"
        - "as_of"
        - "authorised"
        - "granted_outstanding"
        - "exercised"
        - "available"
        - "pending_approval"
    "Stakeholder":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^stk_[0-9a-f]{24}$"
        "entity_id":
          "type": "string"
          "pattern": "^ent_[0-9a-f]{24}$"
        "kind":
          "enum":
            - "founder"
            - "employee"
            - "investor"
            - "advisor"
        "person_id":
          "type": "string"
          "pattern": "^pers_[0-9a-f]{24}$"
        "legal_hold":
          "type": "boolean"
        "erased":
          "type": "boolean"
        "external_holder_attested":
          "type": "boolean"
          "description": "A second actor attested the holder as external (not a director or approver), or, without a directory, established the record."
        "person_verified":
          "type": "boolean"
          "description": "A second actor confirmed that the record is the directory person person_id names."
      "required":
        - "id"
        - "entity_id"
        - "kind"
        - "legal_hold"
        - "erased"
      "description": "No personal data: the identity is a separate sealed, audited read."
    "PersonLinkRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "person_id"
      "properties":
        "person_id":
          "type": "string"
          "pattern": "^pers_[0-9a-f]{24}$"
    "IdentityReviewList":
      "type": "object"
      "properties":
        "items":
          "type": "array"
          "items":
            "type": "object"
            "properties":
              "stakeholder_id":
                "type": "string"
              "entity_id":
                "type": "string"
              "kind":
                "type": "string"
              "person_id":
                "type": "string"
              "reason":
                "enum":
                  - "unconfirmed_person_link"
                  - "unattested_holder"
                  - "erased_holder"
              "open_grants":
                "type": "integer"
              "ledger_entries":
                "type": "integer"
    "MyIdentity":
      "type": "object"
      "properties":
        "subject":
          "type": "string"
        "mode":
          "enum":
            - "directory"
            - "attestation"
        "person_id":
          "type": "string"
        "directory_available":
          "type": "boolean"
        "break_glass":
          "type": "boolean"
    "StakeholderInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "kind":
          "enum":
            - "founder"
            - "employee"
            - "investor"
            - "advisor"
        "person_id":
          "type": "string"
          "pattern": "^pers_[0-9a-f]{24}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "email":
          "type": "string"
          "maxLength": 254
        "tax_id":
          "type": "string"
          "maxLength": 64
      "required":
        - "kind"
        - "name"
      "description": "An employee stakeholder needs the directory person_id."
    "StakeholderList":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Stakeholder"
      "required":
        - "items"
    "Identity":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 200
        "email":
          "type": "string"
          "maxLength": 254
        "tax_id":
          "type": "string"
          "maxLength": 64
      "required":
        - "name"
    "LegalHoldRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "hold":
          "type": "boolean"
        "reason":
          "type": "string"
          "maxLength": 500
      "required":
        - "hold"
    "Erasure":
      "type": "object"
      "additionalProperties": false
      "properties":
        "subject":
          "type": "string"
          "pattern": "^stk_[0-9a-f]{24}$"
        "classes":
          "type": "array"
          "items":
            "type": "string"
        "date":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "retained":
          "type": "array"
          "items":
            "type": "object"
            "additionalProperties": false
            "properties":
              "class":
                "type": "string"
              "count":
                "type": "integer"
                "minimum": 0
              "reason":
                "type": "string"
            "required":
              - "class"
              - "count"
              - "reason"
      "required":
        - "subject"
        - "classes"
        - "date"
        - "retained"
    "Schedule":
      "type": "object"
      "additionalProperties": false
      "properties":
        "kind":
          "enum":
            - "periodic"
            - "tranches"
        "months":
          "type": "integer"
          "minimum": 1
          "maximum": 600
        "cliff_months":
          "type": "integer"
          "minimum": 0
          "maximum": 600
        "interval":
          "enum":
            - "monthly"
            - "quarterly"
        "tranches":
          "type": "array"
          "maxItems": 50
          "items":
            "type": "object"
            "additionalProperties": false
            "properties":
              "label":
                "type": "string"
                "minLength": 1
                "maxLength": 100
              "basis_points":
                "type": "integer"
                "minimum": 1
                "maximum": 10000
              "date":
                "type": "string"
                "format": "date"
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
              "milestone":
                "type": "boolean"
            "required":
              - "label"
              - "basis_points"
            "description": "Give either a date or milestone=true."
        "rounding":
          "enum":
            - "floor"
            - "nearest"
            - "fractional"
        "acceleration":
          "type": "array"
          "maxItems": 10
          "items":
            "type": "object"
            "additionalProperties": false
            "properties":
              "name":
                "type": "string"
                "minLength": 1
                "maxLength": 64
              "type":
                "enum":
                  - "single"
                  - "double"
              "triggers":
                "type": "array"
                "minItems": 1
                "maxItems": 2
                "items":
                  "type": "string"
                  "pattern": "^[a-z][a-z0-9_]{0,39}$"
              "percent_bp":
                "type": "integer"
                "minimum": 1
                "maximum": 10000
              "applies_after_termination":
                "type": "boolean"
            "required":
              - "name"
              - "type"
              - "triggers"
              - "percent_bp"
            "description": "Data only: single needs one trigger, double needs two."
      "required":
        - "kind"
    "Grant":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "pattern": "^grt_[0-9a-f]{24}$"
        "entity_id":
          "type": "string"
          "pattern": "^ent_[0-9a-f]{24}$"
        "plan_id":
          "type": "string"
          "pattern": "^pln_[0-9a-f]{24}$"
        "stakeholder_id":
          "type": "string"
          "pattern": "^stk_[0-9a-f]{24}$"
        "type":
          "enum":
            - "ISO"
            - "NSO"
            - "RSU"
            - "SAR"
        "status":
          "enum":
            - "draft"
            - "pending_approval"
            - "approved"
            - "active"
            - "cancelled"
            - "forfeited"
            - "expired"
