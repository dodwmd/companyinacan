          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
        "strike_minor":
          "type": "integer"
          "minimum": 0
          "maximum": 1125899906842624
          "description": "Integer minor units of the currency."
        "grant_date":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "vesting_start":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "schedule":
          "$ref": "#/components/schemas/Schedule"
        "expiry_date":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "post_termination_exercise_days":
          "type": "integer"
          "minimum": 0
          "maximum": 3650
        "approved_on":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "activated_on":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "termination_date":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "for_cause":
          "type": "boolean"
        "terminal_on":
          "type": "string"
          "format": "date"
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        "terminal_reason":
          "type": "string"
        "exercised":
          "type": "string"
          "pattern": "^-?(0|[1-9][0-9]{0,11})(\\.[0-9]{1,4})?$"
          "description": "Exact decimal, at most 4 decimal places, as a string."
        "approval_ref":
          "type": "string"
        "notes":
          "type": "string"
