      "required":
        - "id"
        - "entity_id"
        - "plan_id"
        - "stakeholder_id"
        - "type"
        - "status"
        - "version"
        - "quantity"
        - "currency"
        - "strike_minor"
        - "grant_date"
        - "vesting_start"
        - "schedule"
        - "expiry_date"
        - "post_termination_exercise_days"
        - "exercised"
    "GrantInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "stakeholder_id":
          "type": "string"
          "pattern": "^stk_[0-9a-f]{24}$"
        "type":
          "enum":
            - "ISO"
            - "NSO"
            - "RSU"
            - "SAR"
