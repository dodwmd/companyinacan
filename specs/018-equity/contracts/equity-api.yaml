  "version": "0.1.0"
  "license":
    "name": "Apache-2.0"
    "identifier": "Apache-2.0"
  "description": "REST JSON API of the in-house equity service: the `equity` capability (legal entities, share classes, plans and pools, stakeholders, option grants with vesting, exercises, an append-only share ledger, cap-table views as of any date, valuation records, illustrative round modelling, audited CSV exports). Equity is a sensitive data class: deny by default, every route needs a bearer token, and one policy layer decides per caller, per record and per field. Callers without visibility get 404 where a 403 would confirm that a record exists. This is a tool, not legal, tax or securities advice. 409A and other valuation rules, ISO/NSO limits, tax treatment, 83(b) elections and ESOP scheme rules are NOT implemented; they exist only as data fields and documented limits. The operator is responsible for compliance with securities, tax and data-protection law."
"servers":
  -
    "url": "http://equity-api.mod-equity.svc:8081"
    "description": "ClusterIP only; there is no public listener"
"security":
  -
    "bearer": []
