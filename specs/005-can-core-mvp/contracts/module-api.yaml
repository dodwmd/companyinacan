openapi: 3.1.0
info:
  title: can-core module API
  version: 1.0.0
  summary: Module-facing API served on its own listener (reachable only from module namespaces).
  description: |
    Every operation except `/healthz` authenticates the caller with its projected ServiceAccount
    token (audience `can`) sent as `Authorization: Bearer <token>`. can-core validates it with a
    Kubernetes TokenReview and maps (namespace, service account) to an installed, enabled module.

    can-core never proxies capability calls: `GET /v1/capabilities/{name}` returns the provider
    URL(s) and the caller then calls the provider directly. Adapters verify their own callers'
    tokens with `POST /v1/tokens/introspect`.

    Events are delivered to subscribers as `POST` requests signed with a per-module HMAC secret:
    see `webhooks.event` below. `email.send` and the `leads` capability are delivered in epic E03
    part 2 / E05 and are not in this version of the contract.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://can-core.can-system.svc.cluster.local:8090
security:
  - serviceAccountToken: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness and readiness probe
      security: []
      responses:
        "200":
          description: can-core is serving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/self:
    get:
      operationId: getSelf
      summary: The calling module's own record
      responses:
        "200":
          description: Identity and state of the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Self" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/tokens/introspect:
    post:
      operationId: introspectToken
      summary: Verify a caller's token (a module's projected token, or a personal access token bound to the calling module)
      description: |
        A projected ServiceAccount token is verified by TokenReview and answers kind `module`. A personal
        access token (`canpat_...`, issued in the admin UI or API) answers kind `user` with its subject
        and permissions, and only to the module it is bound to. The optional `audience` names the module
        the caller serves; a mismatch answers inactive. Every other case (unknown, expired, revoked,
        another module's, malformed) answers {"active": false} without saying why. Personal access
        tokens do not count against the TokenReview rate limit.
        The value of an admin UI session cookie is never accepted here: it is the user's login, not a
        credential for modules. People who sign in through single sign-on use personal access tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntrospectRequest" }
      responses:
        "200":
          description: Introspection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntrospectResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/capabilities/{name}:
    get:
      operationId: resolveCapability
      summary: Resolve a capability to its current provider(s)
      description: |
        The caller must list the capability under `requires.capabilities` or `consumes` in its manifest.
        Exclusive capabilities resolve to exactly one provider (the designated `primary` when several
        modules provide it); aggregate capabilities (`reports`, `portal.view`) resolve to all providers.
        Platform capabilities (`email.send`, `events`, ...) resolve to can-core itself.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_.]*$" } }
      responses:
        "200":
          description: Resolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resolution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/events:
    post:
      operationId: publishEvent
      summary: Publish an event
      description: |
        The event type must be listed under `publishes` in the caller's manifest; the source is the
        authenticated module (never client supplied). The event is persisted to the outbox, then
        delivered at least once to every enabled module whose manifest `subscribes` to the type.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "202":
          description: Accepted and persisted
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  time: { type: string, format: date-time, description: "Absent when source_id repeated an earlier publish" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/check:
    post:
      operationId: checkPermission
      summary: "can.check(subject, permission, resource)"
      description: "The permission must be one the calling module lists under `permissions`. Fails closed: errors answer 503, never allowed. Answers are cached for 30 seconds at most; changes made through can-core apply at once."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/approvals:
    post:
      operationId: createApproval
      summary: "Open an approval request (idempotent)"
      description: "The type must be declared under `approvals` in the module manifest. 422 when no policy or default chain exists or no approver can be found. When the request ends, can-core delivers a signed `approval.decided.v1` webhook to this module only (subscribe in the manifest)."
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalView" }
        "200":
          description: The same request was already created with this key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/approvals/{id}:
    get:
      operationId: getApproval
      summary: "Status of a request the module created"
      description: "Requests of other modules answer 404."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/approvals/{id}/cancel:
    post:
      operationId: cancelApproval
      summary: "Withdraw a pending request"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalCancel" }
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/notifications:
    post:
      operationId: sendNotification
      summary: "Put an item in a person's inbox"
      description: "Needs `notify` under requires.capabilities or consumes. The type must start with the module id and a dot. Use dedupe_key to make a reminder idempotent. Send identifiers, not personal data."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSend" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/identity/revoke:
    post:
      operationId: revokeIdentity
      summary: "End the tokens and sessions of one offboarded person (E13d)"
      description: "Only for a module that provides `identity.provision`. Allowed only when the people module reported party_id as offboarded with a reached effective date and `subject` is the account the directory linked to that person (checked against the SHA-256 prefix carried by person.offboarded.v1). Idempotent, audited with ids and counts only, rate limited per module."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [party_id, subject]
              properties:
                party_id: { type: string, pattern: "^pers_[0-9a-f]{24}$" }
                subject: { type: string, pattern: "^user:[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
      responses:
        "200":
          description: Revoked (counts are zero on a repeat)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens: { type: integer }
                  sessions: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tickets/redeem:
    post:
      operationId: redeemTicket
      summary: "Exchange a one-time launch ticket for the signed-in person (E11c)"
      description: "Single sign-on from the admin UI into a module web UI (specs/036-module-ui-sso). The caller is the module the ticket was minted for (the audience is the authenticated caller, never a field of the body). A ticket lives at most 60 seconds, works once and only for its module; every other case (unknown, malformed, used, expired, another module's, the person disabled or without a permission in the module) is the identical answer `{\"active\": false}`. A valid answer carries the subject, a display name (never an email address or groups), the module permissions the person holds right now, the landing path chosen at launch and an opaque `session` handle the module keeps in memory and presents to `/v1/tickets/revalidate`. Failed redeems are slowed per module past a quota; a valid redeem never is. Audited with ids only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties:
                ticket: { type: string, pattern: "^cant_[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: Active, or the identical inactive answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/tickets/revalidate:
    post:
      operationId: revalidateTicketSession
      summary: "Is the person behind a ticket-started session still allowed? (E11c)"
      description: "A module asks with the `session` handle it got at redeem. The answer is computed now: the person must be enabled and hold at least one permission of the calling module, and the handle must belong to the caller, be unrevoked and younger than 12 hours. The returned permissions replace the module session's permissions. Inactive otherwise (`{\"active\": false}`), without saying why."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session: { type: string, pattern: "^cans_[A-Za-z0-9_-]{43}$" }
      responses:
        "200":
          description: Active with current permissions, or inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
webhooks:
  event:
    post:
      operationId: receiveEvent
      summary: Delivery of an event to a subscribing module (implemented by the module, called by can-core)
      description: |
        Headers: `X-Can-Event-Id` (idempotency key, stable across retries and requeues; delivery is at least once, so receivers MUST deduplicate on it), `X-Can-Event-Type`,
        `X-Can-Attempt`, `X-Can-Timestamp` (unix seconds) and
        `X-Can-Signature: v1=<hex HMAC-SHA256(secret, "<timestamp>." + body)>`. Receivers must verify the
        MAC in constant time and reject timestamps more than 5 minutes from their clock.
        Any 2xx acknowledges. Anything else is retried with exponential backoff (5 s doubling, capped
        at 1 h) up to 8 attempts, after which the delivery is marked dead in the delivery log.
        Redirects are not followed.
      security: []
      parameters:
        - { name: X-Can-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Can-Event-Type, in: header, required: true, schema: { type: string } }
        - { name: X-Can-Attempt, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Can-Timestamp, in: header, required: true, schema: { type: integer } }
        - { name: X-Can-Signature, in: header, required: true, schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
      responses:
        "2XX": { description: Acknowledged }
components:
  securitySchemes:
    serviceAccountToken:
      type: http
      scheme: bearer
      description: Projected ServiceAccount token, audience `can`
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid token
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, const: ok } }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    TicketSession:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        subject: { type: string, pattern: "^user:" }
        name: { type: string, maxLength: 80, description: "Display name; never an email address or groups" }
        permissions: { type: array, items: { type: string } }
        return_path: { type: string, pattern: "^/[A-Za-z0-9/_-]{0,100}$", description: "Landing path inside the module's UI, relative to its base; redeem only" }
        session: { type: string, pattern: "^cans_[A-Za-z0-9_-]{43}$", description: "Opaque handle for revalidation; redeem only" }
        session_expires_at: { type: string, format: date-time, description: "Redeem only" }
    Self:
      type: object
      required: [id, version, namespace, service_account, state, provides]
      properties:
        id: { type: string }
        version: { type: string }
        namespace: { type: string }
        service_account: { type: string }
        state: { type: string, enum: [enabled] }
        provides: { type: array, items: { type: string } }
    IntrospectRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
        audience: { type: string, description: "The module the caller serves (personal access tokens)" }
    IntrospectResponse:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        kind: { type: string, enum: [module, user] }
        subject: { type: string, description: "user:<admin username> (kind user)" }
        permissions: { type: array, items: { type: string }, description: "Module permissions granted to the token (kind user)" }
        expires_at: { type: string, format: date-time }
        module_id: { type: string }
        namespace: { type: string }
        service_account: { type: string }
    Provider:
      type: object
      required: [module, url]
      properties:
        module: { type: string }
        service: { type: string }
        port: { type: integer }
        schema: { type: string }
        url: { type: string }
    Resolution:
      type: object
      required: [capability, aggregate, platform, providers]
      properties:
        capability: { type: string }
        aggregate: { type: boolean }
        platform: { type: boolean }
        providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+\\.v[1-9][0-9]*$" }
        data: { type: object, description: "Event payload, at most 256 KiB" }
        source_id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$", description: "The publisher's own id of the event: publishing it again returns the first event instead of delivering twice" }
    Envelope:
      type: object
      required: [id, type, time, source, data]
      properties:
        id: { type: string }
        type: { type: string }
        time: { type: string, format: date-time }
        source: { type: string, description: Publishing module id or can-core }
        data: { type: object }
    CheckRequest:
      type: object
      additionalProperties: false
      required: [subject, permission]
      properties:
        subject: { type: string, description: "user:<name> or party:<id>" }
        permission: { type: string }
        resource: { type: string, maxLength: 200 }
    CheckResponse:
      type: object
      required: [allowed]
      properties: { allowed: { type: boolean } }
    ApprovalCreate:
      type: object
      additionalProperties: false
      required: [type, requester]
      properties:
        type: { type: string }
        requester: { type: string, description: "user:<name> or party:<id>; cannot approve their own request" }
        ref: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 300 }
        amount: { type: integer, minimum: 0, description: Minor units; compared with policy thresholds }
        payload: { type: object, description: At most 64 KiB; shown to approvers, never put in events }
    ApprovalView:
      type: object
      required: [id, type, requester, status, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        requester: { type: string }
        ref: { type: string }
        status: { type: string, enum: [pending, approved, rejected, cancelled, expired] }
        reason: { type: string, enum: [no_approver] }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    ApprovalCancel:
      type: object
      additionalProperties: false
      properties: { reason: { type: string, maxLength: 2000 } }
    NotificationSend:
      type: object
      additionalProperties: false
      required: [subject, type]
      properties:
        subject: { type: string }
        type: { type: string }
        dedupe_key: { type: string, maxLength: 200 }
        data: { type: object, additionalProperties: { type: string }, description: "At most 20 short string values; `title` and `body` are shown for module-defined types" }
        link: { type: string, description: Site-relative admin UI path }
        urgent: { type: boolean }
    NotificationAccepted:
      type: object
      required: [created]
      properties: { created: { type: boolean, description: false for a duplicate or a muted type } }
