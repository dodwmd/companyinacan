openapi: 3.1.0
info:
  title: can-core admin API
  version: 1.0.0
  summary: Operator-facing API served on the admin listener (reachable only through Traefik).
  description: |
    Authentication is a server-side session. `POST /api/v1/login` verifies password and TOTP code and
    sets the `can_session` cookie (HttpOnly, SameSite=Strict, Secure unless plain-HTTP dev). Unsafe
    methods must send the session's CSRF token in `X-CSRF-Token`. Request bodies are JSON only.
    Errors are `application/problem+json` (RFC 9457).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://admin.example.com
security:
  - session: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness and readiness probe
      security: []
      responses:
        "200":
          description: can-core is serving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/login:
    post:
      operationId: login
      summary: Log in with password and TOTP code
      description: |
        Every failure (unknown user, wrong password, wrong or already-used code) returns the same 401.
        Input limits: body 4 KiB, username 64 characters, password 1024. With CAN_TRUST_PROXY (real client addresses) each address is limited to 10 attempts a minute, 5 failures lock a (username, address) pair and 20 lock an address (429 with Retry-After); without it failures only delay logins and nothing is refused for them, so codes can be guessed by someone who knows the password. The TOTP code is checked before argon2, which runs under a concurrency cap (503 when busy).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie: { schema: { type: string }, description: "can_session; HttpOnly; SameSite=Strict; Secure" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "503":
          description: All password-hashing slots are busy (overload protection); retry shortly
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Locked out
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the lock expires }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/logout:
    post:
      operationId: logout
      summary: Destroy the session
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/session:
    get:
      operationId: getSession
      summary: Current session and its CSRF token
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/modules:
    get:
      operationId: listModules
      summary: Recorded modules and their state
      responses:
        "200":
          description: Modules ordered by id (never includes signing secrets)
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items: { $ref: "#/components/schemas/Module" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{id}:
    get:
      operationId: getModule
      summary: One module
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Module" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/capabilities:
    get:
      operationId: listCapabilities
      summary: Capabilities with at least one enabled provider
      responses:
        "200":
          description: Resolutions; an exclusive capability with several providers and no primary lists every contender
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/Resolution" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/catalogue:
    get:
      operationId: getCatalogue
      summary: Module catalogue with footprint and capability state
      description: |
        Every manifest in the modules directory with its status (`ready`, `experimental`, `not-deployable`),
        licence class, declared RAM, requires/provides (planned provisions have `served: false`), whether
        company.yaml enables it, the exclusive capabilities that are served twice without a primary, and the
        footprint of the enabled modules against the declared server size (`verdict` is `unknown` when no size is
        declared). Needs `platform.view`. Changes are made in the admin UI (preview, then apply); this endpoint is read-only.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalogue" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Module readiness, last reconcile, certificate and disk status
      description: |
        Needs `platform.view`. `certificates_available` and `disk_available` are false when the source is not
        configured or failed; an unavailable source is never reported as healthy. Error texts are sanitised.
      responses:
        "200":
          description: The status snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit records, oldest first
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0 }, description: Return records with seq greater than this }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/AuditRecord" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/audit/verify:
    get:
      operationId: verifyAudit
      summary: Verify the audit hash chain
      parameters:
        - { name: head, in: query, schema: { type: string, pattern: "^[1-9][0-9]*:[0-9a-f]{64}$" }, description: Externally recorded head (seq:hash) the log must still contain }
      responses:
        "200":
          description: Verification result; `violation` is present when the log was modified, reordered or truncated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerification" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/deliveries:
    get:
      operationId: listDeliveries
      summary: Webhook delivery log (newest first)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/deliveries/{id}/attempts:
    get:
      operationId: listDeliveryAttempts
      summary: Attempts of one delivery
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Attempts in order
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts:
                    type: array
                    items: { $ref: "#/components/schemas/Attempt" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/deliveries/{id}/requeue:
    post:
      operationId: requeueDelivery
      summary: Requeue a dead delivery with a fresh attempt budget
      description: Receivers must still deduplicate on X-Can-Event-Id, because delivery is at least once.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Requeued }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: "Approval requests: waiting on me, mine, or all"
      description: "view=all needs approvals.admin. The requester never sees their own request under view=waiting."
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [waiting, requested, all] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}:
    get:
      operationId: getApproval
      summary: "One request with steps and decision history"
      description: "Anyone who may not see the request gets 404, as for a missing id. The read is audited (approval.read)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}/decision:
    post:
      operationId: decideApproval
      summary: "Approve or reject as an approver"
      description: "403 when the caller is the requester (separation of duties) or is not an approver of an open step; 409 when already decided or already voted."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}/comments:
    post:
      operationId: commentApproval
      summary: "Add a comment"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/approvals/{id}/cancel:
    post:
      operationId: cancelApproval
      summary: "Withdraw a pending request"
      description: "The requester or an approvals admin."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "204": { description: Cancelled }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: "Personal access tokens (your own; all with rbac.manage)"
      responses:
        "200": { description: "Token records, never the token value or its hash", content: { application/json: { schema: { $ref: "#/components/schemas/TokenList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: issueToken
      summary: "Issue a personal access token for one module"
      description: "The permissions must be declared by the module and held by the caller. The token is returned once and only its hash is stored."
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokenRequest" }
      responses:
        "201": { description: "Issued", content: { application/json: { schema: { $ref: "#/components/schemas/IssuedToken" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: "Revoke a token (your own; any with rbac.manage)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/apps:
    get:
      operationId: listApps
      summary: "Modules with a web UI you may open (E11c)"
      description: "Enabled modules that declare `runtime.web_login` (their web UI accepts launch tickets), have an acceptable UI address (https on the company domain, set by configuration, never by the request) and in which you hold at least one of the module's permissions."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/apps/{id}/launch:
    post:
      operationId: launchApp
      summary: "Single sign-on into a module's web UI (E11c)"
      description: "Mints a one-time launch ticket for the signed-in user, bound to this module and valid for at most 60 seconds, and returns the URL to open in the browser. The URL is built from configuration; `return_path` is only a place inside the module (a slash then letters, digits, `/`, `_`, `-`). 404 when the app is unknown, has no UI or you hold no permission in it (the same answer). Limited to 30 launches per user and minute (429). Audited with ids only."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                return_path: { type: string, pattern: "^/[A-Za-z0-9/_-]{0,100}$" }
      responses:
        "200": { description: "The URL to open (contains the ticket: do not log or store it). Also sets the `__Secure-can_launch_<module>` nonce cookie (HttpOnly, SameSite=Strict, 60 s): the URL works only in the client holding it", content: { application/json: { schema: { $ref: "#/components/schemas/AppLaunch" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/delegations:
    get:
      operationId: listDelegations
      summary: "Your current and future delegations"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegationList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDelegation
      summary: "Delegate your approvals while out of office"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/delegations/{id}/revoke:
    post:
      operationId: revokeDelegation
      summary: "End one of your delegations"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: "Your inbox, newest first"
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/unread-count:
    get:
      operationId: unreadCount
      summary: "Unread notifications, capped"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      summary: "Mark your whole inbox read"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/{id}/read:
    post:
      operationId: readNotification
      summary: "Mark one of your notifications read"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Empty" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-settings:
    get:
      operationId: getNotificationSettings
      summary: "Your delivery settings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setNotificationSettings
      summary: "Replace your delivery settings"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-preferences:
    get:
      operationId: listNotificationPreferences
      summary: "Your per-type, per-channel preferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: setNotificationPreference
      summary: "Turn a channel on or off for a notification type"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preference" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      summary: "Delivery log (notifications.admin)"
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDeliveryList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/push/vapid-public-key:
    get:
      operationId: getPushPublicKey
      summary: "The VAPID public key (applicationServerKey) browsers subscribe with; created on first use"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushPublicKey" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/push/subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: "Your push devices (never the endpoint or keys)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDeviceList" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addPushSubscription
      summary: "Register a browser's PushSubscription (toJSON form); at most 10 per user"
      description: "The endpoint must be an https URL on port 443 naming a public DNS host; addresses, userinfo, fragments and internal names are refused with 400. Re-posting a known endpoint refreshes it. 409 when the user already has 10 devices."
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [id], properties: { id: { type: integer } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePushSubscription
      summary: "Remove your device by endpoint"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [endpoint], properties: { endpoint: { type: string } } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/push/test:
    post:
      operationId: sendPushTest
      summary: "Send a generic test notification to your devices (one per 30 seconds)"
      security: [{ session: [], csrf: [] }]
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [sent], properties: { sent: { type: integer } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/push/vapid-key/rotate:
    post:
      operationId: rotatePushKey
      summary: "Replace the VAPID key pair and drop every subscription (rbac.manage); 409 when the key is a mounted Secret"
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Rotated }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: "Roles with effective permissions (rbac.manage)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/roles/{role}/overrides:
    post:
      operationId: overrideRole
      summary: "Grant, revoke or reset one permission of a role (owner, step-up)"
      description: "The owner role cannot be edited."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: role, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users:
    get:
      operationId: listUsers
      summary: "Admin users with their role assignments (rbac.manage)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      summary: "Create a local account with no role and a one-time set-up link (rbac.manage, step-up)"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { username: { type: string }, email: { type: string }, send_email: { type: boolean } } }
      responses:
        "201":
          description: The link, or that it was mailed
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/reauth:
    post:
      operationId: reauthenticate
      summary: "Step-up: confirm password and a fresh code for this session. Sensitive user administration needs a sign-in or this within 10 minutes. Five wrong tries end the session"
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { password: { type: string }, totp: { type: string } } }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}:
    get:
      operationId: getUser
      summary: "One account with its roles, sessions, tokens, identity and what each role grants (rbac.manage)"
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteUser
      summary: "Delete an account and everything it signs in with; the name is never reused (rbac.manage, step-up; owners by owners; 409 for the last owner)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/link:
    post:
      operationId: userSetupLink
      summary: "End the credentials and make a one-time set-up link: purpose invite, mfa (code only) or reset (password and code) (rbac.manage, step-up)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { purpose: { type: string }, email: { type: string }, send_email: { type: boolean } } }
      responses:
        "201":
          description: The link, or that it was mailed
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/disable:
    post:
      operationId: disableUser
      summary: "Disable an account and end its sessions and tokens (rbac.manage, step-up)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/enable:
    post:
      operationId: enableUser
      summary: "Enable a disabled account (owner, step-up)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/sessions:
    delete:
      operationId: revokeUserSessions
      summary: "End every session of the account (rbac.manage; owners by owners)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/sessions/{sid}:
    delete:
      operationId: revokeUserSession
      summary: "End one session of the account (rbac.manage; owners by owners)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/tokens/{id}:
    delete:
      operationId: revokeUserToken
      summary: "Revoke one personal access token of the account (rbac.manage; owners by owners)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/roles:
    post:
      operationId: grantRole
      summary: "Assign a role (rbac.manage, step-up; only permissions you hold; owners by owners)"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "204": { description: Assigned }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/users/{username}/roles/revoke:
    post:
      operationId: revokeRole
      summary: "Remove a role; the tokens and sessions of the account end (rbac.manage, step-up; owners by owners)"
      description: "409 when it would leave the installation without an owner."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/sso:
    get:
      operationId: getSSO
      summary: "Single sign-on status without secrets (rbac.manage; E11b)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/identity/revoke-now:
    post:
      operationId: revokeNow
      summary: "End the tokens and sessions of an account at once, disable it and drop its push subscriptions (rbac.manage). For a termination that cannot wait for the people module to report the person offboarded. Audited with the actor; never your own account. Disabling an owner needs an owner (403 otherwise); the last enabled owner cannot be disabled (409); an unknown account is 404."
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject: { type: string, pattern: "^user:[A-Za-z0-9_.@-]{1,64}$" }
      responses:
        "200":
          description: Revoked (counts are zero on a repeat)
          content:
            application/json:
              schema: { type: object, properties: { tokens: { type: integer }, sessions: { type: integer } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/identity/enable:
    post:
      operationId: enableAccount
      summary: "Re-enable a disabled admin account (owner only; rbac.manage is not enough). Audited. Tokens and sessions are not restored."
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject: { type: string, pattern: "^user:[A-Za-z0-9_.@-]{1,64}$" }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/sso/test:
    post:
      operationId: testSSO
      summary: "Fetch discovery and signing keys the way sign-in does: https, public addresses, no redirects, size caps (rbac.manage). Audited."
      security: [{ session: [], csrf: [] }]
      responses:
        "200":
          description: Result; ok=false carries a short reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOTest" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/sso/identities:
    get:
      operationId: listSSOIdentities
      summary: "External identities that have signed in (rbac.manage)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [identities]
                properties:
                  identities:
                    type: array
                    items: { $ref: "#/components/schemas/SSOIdentity" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/sso/identities/{id}/link:
    post:
      operationId: linkSSOIdentity
      summary: "Bind an identity to an existing local administrator. Owner only; never automatic."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username: { type: string }
      responses:
        "204": { description: Linked }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/sso/identities/{id}/unlink:
    post:
      operationId: unlinkSSOIdentity
      summary: "Remove an identity; a provisioned user is deleted with it, a linked local account stays. Owner only."
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: can_session
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, const: ok } }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, totp]
      properties:
        username: { type: string }
        password: { type: string }
        totp: { type: string, pattern: "^[0-9]{6}$" }
    Session:
      type: object
      required: [username, csrf_token, expires_at]
      properties:
        username: { type: string }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
        source: { type: string, enum: [local, sso] }
    Module:
      type: object
      required: [id, version, state, namespace, provides, ram_mb, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        state: { type: string, enum: [enabled, disabled, failed] }
        namespace: { type: string }
        last_error: { type: string }
        provides: { type: array, items: { type: string } }
        ram_mb: { type: integer }
        updated_at: { type: string, format: date-time }
    Catalogue:
      type: object
      required: [modules, conflicts, footprint]
      properties:
        modules:
          type: array
          items: { $ref: "#/components/schemas/CatalogueEntry" }
        conflicts: { type: array, items: { type: string } }
        footprint:
          type: object
          required: [platform_mb, request_mb, limit_mb, database_mb, total_mb, server_mb, verdict]
          properties:
            platform_mb: { type: integer }
            request_mb: { type: integer }
            limit_mb: { type: integer }
            database_mb: { type: integer }
            total_mb: { type: integer }
            server_mb: { type: integer, description: "0 when the server size is not declared" }
            verdict: { type: string, enum: [fits, tight, over, unknown] }
    CatalogueEntry:
      type: object
      required: [id, status, source_available, deployable, enabled, ram_mb, ram_limit_mb, requires, provides]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [ready, experimental, not-deployable] }
        licence_class: { type: string, enum: [osi, source-available] }
        source_available: { type: boolean }
        deployable: { type: boolean }
        enabled: { type: boolean }
        ram_mb: { type: integer }
        ram_limit_mb: { type: integer }
        invalid: { type: string }
        requires:
          type: array
          items:
            type: object
            required: [capability, state]
            properties:
              capability: { type: string }
              state: { type: string, enum: [met, platform, planned, missing, none, unmet] }
        provides:
          type: array
          items:
            type: object
            required: [capability, served]
            properties:
              capability: { type: string }
              served: { type: boolean }
    StatusReport:
      type: object
      required: [modules, certificates, certificates_available, disk, disk_available]
      properties:
        modules:
          type: array
          items:
            type: object
            required: [id, state, ready, version]
            properties:
              id: { type: string }
              state: { type: string, enum: [enabled, disabled, failed] }
              ready: { type: string, enum: ["yes", "no", "off", unknown] }
              version: { type: string }
              last_error: { type: string }
        reconcile:
          type: object
          required: [at, ok, actions, failed]
          properties:
            at: { type: string, format: date-time }
            ok: { type: boolean }
            actions: { type: integer }
            failed: { type: integer }
            error: { type: string }
        certificates:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              state: { type: string }
              days_left: { type: integer }
        certificates_available: { type: boolean }
        disk:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              used_bytes: { type: integer }
              total_bytes: { type: integer }
              used_percent: { type: integer }
        disk_available: { type: boolean }
    Provider:
      type: object
      required: [module, url]
      properties:
        module: { type: string }
        service: { type: string }
        port: { type: integer }
        schema: { type: string }
        url: { type: string }
    Resolution:
      type: object
      required: [capability, aggregate, platform, providers]
      properties:
        capability: { type: string }
        aggregate: { type: boolean }
        platform: { type: boolean }
        providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
    AuditRecord:
      type: object
      required: [seq, time, actor, action, target, detail, prev_hash, hash]
      properties:
        seq: { type: integer }
        time: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        detail: { type: string, description: JSON object serialised as a string (hashed byte for byte) }
        prev_hash: { type: string }
        hash: { type: string }
    AuditVerification:
      type: object
      required: [entries, head]
      properties:
        entries: { type: integer }
        head:
          type: object
          properties: { seq: { type: integer }, hash: { type: string } }
        violation:
          type: object
          required: [seq, kind, message]
          properties:
            seq: { type: integer }
            kind: { type: string, enum: [hash-mismatch, chain-break, seq-gap, head-mismatch] }
            message: { type: string }
    Delivery:
      type: object
      required: [id, event_id, event_type, module, status, attempts, next_attempt_at]
      properties:
        id: { type: integer }
        event_id: { type: string }
        event_type: { type: string }
        module: { type: string }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
    Attempt:
      type: object
      required: [attempt, at, status_code, duration_ms]
      properties:
        attempt: { type: integer }
        at: { type: string, format: date-time }
        status_code: { type: integer }
        error: { type: string }
        duration_ms: { type: integer }
    Empty: { type: object, additionalProperties: false }
    Created: { type: object, required: [id], properties: { id: { type: integer } } }
    Approval:
      type: object
      required: [id, module_id, type, requester, status, created_at]
      properties:
        id: { type: string, pattern: "^apr_[0-9a-f]{24}$" }
        module_id: { type: string }
        type: { type: string }
        requester: { type: string, description: "user:<name> or party:<id>" }
        ref: { type: string }
        title: { type: string }
        amount: { type: integer, description: Minor units }
        status: { type: string, enum: [pending, approved, rejected, cancelled, expired] }
        outcome_reason: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    ApprovalList:
      type: object
      required: [approvals]
      properties: { approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } } }
    ApprovalStep:
      type: object
      properties:
        idx: { type: integer }
        name: { type: string }
        stage: { type: integer }
        quorum: { type: integer }
        status: { type: string, enum: [waiting, active, approved, rejected, skipped] }
        roles: { type: array, items: { type: string } }
        users: { type: array, items: { type: string } }
        approvals: { type: integer }
    ApprovalDecision:
      type: object
      properties:
        id: { type: integer }
        step_idx: { type: integer }
        actor: { type: string }
        on_behalf_of: { type: string }
        kind: { type: string, enum: [approve, reject, comment, cancel, escalate, expire, system] }
        comment: { type: string }
        at: { type: string, format: date-time }
    ApprovalDetail:
      type: object
      required: [request, steps, decisions]
      properties:
        request: { $ref: "#/components/schemas/Approval" }
        steps: { type: array, items: { $ref: "#/components/schemas/ApprovalStep" } }
        decisions: { type: array, items: { $ref: "#/components/schemas/ApprovalDecision" } }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string, maxLength: 2000 }
    CommentRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties: { comment: { type: string, minLength: 1, maxLength: 2000 } }
    IssueTokenRequest:
      type: object
      additionalProperties: false
      required: [module, name, permissions, ttl_hours]
      properties:
        module: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        permissions: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        ttl_hours: { type: integer, minimum: 1, maximum: 8760, description: "can-core refuses more than its configured maximum, 90 days by default" }
    IssuedToken:
      type: object
      required: [id, token, module, permissions, expires_at]
      properties:
        id: { type: string }
        token: { type: string, description: "canpat_..., shown once" }
        module: { type: string }
        permissions: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
    AppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    AppLaunch:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              module: { type: string }
              subject: { type: string }
              permissions: { type: array, items: { type: string } }
              created_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time }
              revoked: { type: boolean }
              expired: { type: boolean }
    CancelRequest:
      type: object
      additionalProperties: false
      properties: { reason: { type: string, maxLength: 2000 } }
    DelegationRequest:
      type: object
      additionalProperties: false
      required: [delegate, from, to]
      properties:
        delegate: { type: string, description: "user:<name> or party:<id>" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: At most 90 days after from }
    DelegationList:
      type: object
      required: [delegations]
      properties:
        delegations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              delegator: { type: string }
              delegate: { type: string }
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: { type: string } }
        link: { type: string }
        urgent: { type: boolean }
        created_at: { type: string, format: date-time }
        read: { type: boolean }
    NotificationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        next_before: { type: integer, description: Pass as `before` for the next page }
    UnreadCount:
      type: object
      required: [unread, capped_at]
      properties: { unread: { type: integer }, capped_at: { type: integer } }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [email, quiet_start, quiet_end, tz, digest]
      properties:
        email: { type: string, maxLength: 254 }
        quiet_start: { type: integer, minimum: -1, maximum: 1439, description: Minutes after midnight; -1 for none }
        quiet_end: { type: integer, minimum: -1, maximum: 1439 }
        tz: { type: string }
        digest: { type: string, enum: [off, hourly, daily] }
    PushPublicKey:
      type: object
      additionalProperties: false
      required: [public_key]
      properties: { public_key: { type: string, description: "Uncompressed P-256 point, base64url (87 characters)" } }
    PushSubscription:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 500 }
        expirationTime: { type: [integer, "null"] }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: "Browser public key, base64url, 65-byte P-256 point" }
            auth: { type: string, description: "Browser auth secret, base64url, 16 bytes" }
    PushDevice:
      type: object
      additionalProperties: false
      required: [id, label, service, created_at]
      properties:
        id: { type: integer }
        label: { type: string, description: "Coarse device label such as 'Chrome on Android'" }
        service: { type: string, description: "Host of the push service" }
        created_at: { type: string, format: date-time }
        last_ok: { type: string, format: date-time }
    PushDeviceList:
      type: object
      additionalProperties: false
      required: [subscriptions]
      properties: { subscriptions: { type: array, items: { $ref: "#/components/schemas/PushDevice" } } }
    Preference:
      type: object
      additionalProperties: false
      required: [type, channel, enabled]
      properties:
        type: { type: string, description: Notification type or "*" }
        channel: { type: string, enum: [email, inapp, webpush] }
        enabled: { type: boolean }
    PreferenceList:
      type: object
      required: [preferences]
      properties: { preferences: { type: array, items: { $ref: "#/components/schemas/Preference" } } }
    NotificationDeliveryList:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              notification_id: { type: integer }
              channel: { type: string }
              status: { type: string, enum: [sent, failed, queued, suppressed] }
              detail: { type: string }
              at: { type: string, format: date-time }
    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              permissions: { type: array, items: { type: string } }
              sources: { type: array, items: { type: string } }
              overrides: { type: array, items: { type: string } }
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              subject: { type: string }
              assignments:
                type: array
                items:
                  type: object
                  properties:
                    role: { type: string }
                    scope: { type: string }
                    granted_by: { type: string }
                    granted_at: { type: string, format: date-time }
    SSOStatus:
      type: object
      required: [configured, enabled, group_roles, require_email_verified, require_mapped_role, rp_logout, allow_insecure_dev, identities]
      properties:
        configured: { type: boolean }
        enabled: { type: boolean }
        error: { type: string }
        issuer: { type: string }
        client_id: { type: string }
        client_secret_ref: { type: string, description: "The Secret's name; the value is never returned." }
        redirect_uri: { type: string }
        scopes: { type: array, items: { type: string } }
        group_roles:
          type: array
          items:
            type: object
            properties:
              group: { type: string }
              roles: { type: array, items: { type: string } }
        allowed_email_domains: { type: array, items: { type: string } }
        require_email_verified: { type: boolean }
        require_amr: { type: array, items: { type: string } }
        require_mapped_role: { type: boolean }
        local_login: { type: string, enum: [all, owner_only, disabled] }
        local_login_effective: { type: string, enum: [all, owner_only, disabled] }
        revalidate_interval: { type: string }
        rp_logout: { type: boolean }
        allow_insecure_dev: { type: boolean }
        identities: { type: integer }
    SSOTest:
      type: object
      required: [ok, message, keys]
      properties:
        ok: { type: boolean }
        message: { type: string }
        issuer: { type: string }
        keys: { type: integer }
        authorization_host: { type: string }
    SSOIdentity:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        name: { type: string }
        groups: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string } }
        linked: { type: boolean, description: "Bound to a local account by an administrator." }
        linked_by: { type: string }
        external_subject: { type: string }
        created_at: { type: string }
        last_login: { type: string }
    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string }
        scope: { type: string, description: "Empty for everything, or a prefix ending in /*" }
    OverrideRequest:
      type: object
      additionalProperties: false
      required: [permission, effect]
      properties:
        permission: { type: string }
        effect: { type: string, enum: [grant, revoke, reset] }
