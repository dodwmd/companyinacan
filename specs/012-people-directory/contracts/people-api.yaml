        type: { type: "string" }
        status: { enum: ["draft", "pending", "approved", "rejected", "cancelled"] }
        start_date: { type: "string" }
        end_date: { type: "string" }
        halves: { type: "integer" }
        days: { type: "number" }
        note: { type: "string" }
