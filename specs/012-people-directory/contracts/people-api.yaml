            - "invalid"
            - "unauthenticated"
            - "forbidden"
            - "not_found"
            - "conflict"
            - "internal"
        message:
          type: "string"
    Question:
      type: "object"
      required: ["id", "text", "type", "audience"]
      properties:
        id: { type: "string", pattern: "^[a-z][a-z0-9_-]{0,31}$" }
        text: { type: "string", maxLength: 300 }
        type: { enum: ["rating", "text"] }
        audience: { enum: ["all", "self", "manager", "peer", "upward"] }
    Answers:
      type: "object"
      description: "question id to answer. A rating question takes rating (1..rating_max of the cycle), a text question takes text."
      additionalProperties:
        type: "object"
        properties:
          rating: { type: "integer" }
          text: { type: "string", maxLength: 4000 }
    ReviewTemplate:
      type: "object"
      properties:
        id: { type: "string" }
        name: { type: "string" }
        questions: { type: "array", items: { "$ref": "#/components/schemas/Question" } }
    CycleIn:
      type: "object"
      required: ["name", "template_id", "anonymity"]
      properties:
        name: { type: "string" }
        template_id: { type: "string" }
        anonymity: { enum: ["anonymous", "attributed"] }
        min_responses: { type: "integer", minimum: 3, maximum: 50 }
        rating_max: { type: "integer", minimum: 3, maximum: 10 }
        due_date: { type: "string", format: "date" }
    Cycle:
      type: "object"
      properties:
        id: { type: "string" }
        name: { type: "string" }
        state: { enum: ["draft", "open", "calibration", "closed"] }
        anonymity: { enum: ["anonymous", "attributed"] }
        min_responses: { type: "integer" }
        rating_max: { type: "integer" }
        questions: { type: "array", items: { "$ref": "#/components/schemas/Question" } }
    CycleState:
      type: "object"
      required: ["state"]
      properties:
        state: { enum: ["open", "calibration", "closed"] }
