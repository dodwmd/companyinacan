        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
    post:
      summary: "Add a blackout period (company or team)"
      description: "Who: hr or admin"
      tags:
        - "timeoff"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/BlackoutIn" }
      responses:
        "201":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/Blackout" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/blackouts/{id}":
    delete:
      summary: "Remove a blackout period"
      description: "Who: hr or admin"
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "done"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-requests":
    get:
      summary: "List leave requests"
      description: "The caller's own (drafts included), their direct reports' (live reporting line; no drafts) and, for hr, everyone's. Notes are not part of a list. Reads of other people's requests are audited."
      tags:
        - "timeoff"
      parameters:
        - name: "person_id"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/LeaveRequest" } } } }
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
    post:
      summary: "Create a draft leave request for oneself"
      description: "Who: the person themself. Half days: start_part pm, end_part am."
      tags:
        - "timeoff"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/LeaveRequestIn" }
      responses:
        "201":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveRequest" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-requests/{id}":
    get:
      summary: "Get a leave request"
      description: "Who: the person, their direct manager, hr. Colleagues, skip-level managers and everyone else get 404; a draft is the person's alone. Audited."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveRequest" }
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
    patch:
      summary: "Edit a draft"
      description: "Who: the person"
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/LeaveRequestIn" }
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveRequest" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-requests/{id}/submit":
    post:
      summary: "Submit a draft"
      description: "Computes working days from the person's holiday calendar; refuses overlaps, blackouts (except types that ignore them) and an insufficient balance, in one transaction."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveRequest" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-requests/{id}/decision":
    post:
      summary: "Approve or reject a pending request"
      description: "Who: the live direct manager, or hr when there is none; never the requester (separation of duties, NFKC/casefold on subjects, also applied to an approval engine's decider). Approving appends a use entry to the ledger and publishes timeoff.approved.v1."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/ApproveIn" }
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveRequest" }
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-requests/{id}/cancel":
    post:
      summary: "Cancel a request"
      description: "Who: the person until the leave starts; hr after. An approved cancellation appends a reversal entry for the days not yet taken and publishes timeoff.cancelled.v1."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveRequest" }
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/people/{id}/leave-balances":
    get:
      summary: "Balances of a person as of a date"
      description: "Who: the person, their direct manager, hr. Others get 404. Audited. Query: as_of (default today)."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "as_of"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/Balance" } } } }
        "400":
          "$ref": "#/components/responses/Invalid"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/people/{id}/leave-ledger":
    get:
      summary: "The append-only balance ledger of a person"
      description: "Who: the person, their direct manager, hr. Audited. Query: type_id."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "type_id"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/LedgerEntry" } } } }
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/people/{id}/leave-adjustments":
    post:
      summary: "Append a manual adjustment to the ledger"
      description: "Who: hr or admin, never for their own record. A reason is required (sealed)."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/AdjustIn" }
      responses:
        "201":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LedgerEntry" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/timeoff/calendar":
    get:
      summary: "Who is out between two dates"
      description: "Colleagues see only that someone is out (no type, reason, request id or status; pending requests are invisible to them). The person, their direct manager and hr also see the type and status. At most 92 days. Query: from, to, team_id (default the caller's team; hr may pass all)."
      tags:
        - "timeoff"
      parameters:
        - name: "from"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "to"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "team_id"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/CalendarEntry" } } } }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/timeoff/accruals/run":
    post:
      summary: "Run the accrual and carry-over job now"
      description: "Who: hr or admin. Idempotent; also runs hourly."
      tags:
        - "timeoff"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/EntriesCount" }
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      description: "User tokens are resolved by can-core introspection to {subject, roles} (roles: employee, manager, hr, admin). The can-core service account holds hr+admin and has no person record. Roles are necessary, not sufficient: relationships (self, direct manager, manager chain) and the caller's own employment status are checked on every call, so a terminated manager's still-valid token gets nothing."
  responses:
    Unauthenticated:
      description: "Missing, invalid or inactive token"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: "The caller may see the resource but may not do this"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "Not found, or not visible to the caller"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Invalid:
      description: "Validation failed"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: "State conflict, for example an invalid status transition, a pending change, or a legal hold"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Person:
      type: "object"
      description: "A directory-basic record (id, kind, status, names, work contact, org references, dates; sso_subject, legal_hold and erased for hr/admin only). Definitive shape: schemas/capabilities/*.v1.json."
    PersonList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Person"
        next_cursor:
          type: "string"
      required:
        - "items"
    CreatePersonRequest:
      type: "object"
      additionalProperties: false
      required:
        - "kind"
        - "given_name"
        - "family_name"
      properties:
        kind:
          enum:
            - "employee"
            - "contractor"
        status:
          enum:
            - "candidate"
            - "onboarding"
            - "active"
        given_name:
          type: "string"
        family_name:
          type: "string"
        preferred_name:
          type: "string"
        work_email:
          type: "string"
        work_phone:
          type: "string"
        location:
          type: "string"
        department_id:
          type: "string"
        team_id:
          type: "string"
        position_id:
          type: "string"
        manager_id:
          type: "string"
          pattern: "^pers_[0-9a-f]{24}$"
        start_date:
          type: "string"
          format: "date"
        sso_subject:
          type: "string"
    UpdatePersonRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        given_name:
          type: "string"
        family_name:
          type: "string"
        preferred_name:
          type: "string"
        work_email:
          type: "string"
        work_phone:
          type: "string"
        location:
          type: "string"
        department_id:
          type: "string"
        team_id:
          type: "string"
        position_id:
          type: "string"
        sso_subject:
          type: "string"
        start_date:
          type: "string"
    SensitiveFields:
      type: "object"
      description: "Only the fields the caller may read. date_of_birth, national_id, home_address, personal_phone (strings) and salary ({amount in minor units, currency, period}); null when unset."
    PutSensitiveRequest:
      type: "object"
      minProperties: 1
      additionalProperties: false
      properties:
        date_of_birth:
          type:
            - "string"
            - "null"
          format: "date"
        national_id:
          type:
            - "string"
            - "null"
        home_address:
          type:
            - "string"
            - "null"
        personal_phone:
          type:
            - "string"
            - "null"
        salary:
          type:
            - "object"
            - "null"
    StatusChangeRequest:
      type: "object"
      additionalProperties: false
      required:
        - "status"
      properties:
        status:
          enum:
            - "candidate"
            - "onboarding"
            - "active"
            - "leave"
            - "offboarding"
            - "former"
        effective_date:
          type: "string"
          format: "date"
        note:
          type: "string"
    HistoryList:
      type: "array"
      items:
        type: "object"
    SetManagerRequest:
      type: "object"
      additionalProperties: false
      required:
        - "manager_id"
      properties:
        manager_id:
          type: "string"
          description: "Empty string clears the manager."
    LegalHoldRequest:
      type: "object"
      additionalProperties: false
      required:
        - "hold"
      properties:
        hold:
          type: "boolean"
        reason:
          type: "string"
    Erasure:
      type: "object"
      properties:
        subject:
          type: "string"
          pattern: "^pers_[0-9a-f]{24}$"
        classes:
          type: "array"
          items:
            type: "string"
        date:
          type: "string"
          format: "date"
    ErasureList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            type: "object"
            properties:
              seq:
                type: "integer"
              subject:
                type: "string"
              class:
                type: "string"
              date:
                type: "string"
                format: "date"
    RetentionReport:
      type: "object"
      properties:
        purged:
          type: "object"
        skipped_legal_hold:
          type: "object"
    OrgInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
      properties:
        name:
          type: "string"
        department_id:
          type: "string"
        lead_id:
          type: "string"
    OrgUnit:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        department_id:
          type: "string"
        lead_id:
          type: "string"
    OrgUnitList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/OrgUnit"
      required:
        - "items"
    TemplateInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "kind"
        - "items"
      properties:
        name:
          type: "string"
        kind:
          enum:
            - "onboarding"
            - "offboarding"
        auto_status:
          enum:
            - ""
            - "onboarding"
            - "offboarding"
        items:
          type: "array"
          minItems: 1
          maxItems: 50
          items:
            type: "object"
            required:
              - "title"
              - "assignee_role"
            properties:
              title:
                type: "string"
              assignee_role:
                enum:
                  - "self"
                  - "manager"
                  - "hr"
                  - "admin"
              due_offset_days:
                type: "integer"
              action:
                type: "string"
    Template:
      type: "object"
    TemplateList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Template"
      required:
        - "items"
    CreateChecklistRequest:
      type: "object"
      additionalProperties: false
      required:
        - "template_id"
      properties:
        template_id:
