components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      description: "User tokens are resolved by can-core introspection to {subject, roles} (roles: employee, manager, hr, admin). The can-core service account holds hr+admin and has no person record. Roles are necessary, not sufficient: relationships (self, direct manager, manager chain) and the caller's own employment status are checked on every call, so a terminated manager's still-valid token gets nothing."
  responses:
    Unauthenticated:
      description: "Missing, invalid or inactive token"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: "The caller may see the resource but may not do this"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "Not found, or not visible to the caller"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Invalid:
      description: "Validation failed"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: "State conflict, for example an invalid status transition, a pending change, or a legal hold"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Person:
      type: "object"
      description: "A directory-basic record (id, kind, status, names, work contact, org references, dates; sso_subject, legal_hold and erased for hr/admin only). Definitive shape: schemas/capabilities/*.v1.json."
    PersonList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Person"
        next_cursor:
          type: "string"
      required:
        - "items"
    CreatePersonRequest:
      type: "object"
      additionalProperties: false
      required:
        - "kind"
        - "given_name"
        - "family_name"
      properties:
        kind:
          enum:
            - "employee"
            - "contractor"
        status:
          enum:
            - "candidate"
            - "onboarding"
            - "active"
        given_name:
          type: "string"
        family_name:
          type: "string"
        preferred_name:
          type: "string"
        work_email:
          type: "string"
        work_phone:
          type: "string"
        location:
          type: "string"
        department_id:
          type: "string"
        team_id:
          type: "string"
        position_id:
          type: "string"
        manager_id:
          type: "string"
          pattern: "^pers_[0-9a-f]{24}$"
        start_date:
          type: "string"
          format: "date"
        sso_subject:
          type: "string"
    UpdatePersonRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        given_name:
          type: "string"
        family_name:
          type: "string"
        preferred_name:
          type: "string"
        work_email:
          type: "string"
        work_phone:
          type: "string"
        location:
          type: "string"
        department_id:
          type: "string"
        team_id:
          type: "string"
        position_id:
          type: "string"
        sso_subject:
          type: "string"
        start_date:
          type: "string"
    SensitiveFields:
      type: "object"
      description: "Only the fields the caller may read. date_of_birth, national_id, home_address, personal_phone (strings) and salary ({amount in minor units, currency, period}); null when unset."
    PutSensitiveRequest:
      type: "object"
      minProperties: 1
      additionalProperties: false
      properties:
        date_of_birth:
          type:
            - "string"
            - "null"
          format: "date"
        national_id:
          type:
            - "string"
            - "null"
        home_address:
          type:
            - "string"
            - "null"
        personal_phone:
          type:
            - "string"
            - "null"
        salary:
          type:
            - "object"
            - "null"
    StatusChangeRequest:
      type: "object"
      additionalProperties: false
      required:
        - "status"
      properties:
        status:
          enum:
            - "candidate"
            - "onboarding"
            - "active"
            - "leave"
            - "offboarding"
            - "former"
        effective_date:
          type: "string"
          format: "date"
        note:
          type: "string"
    HistoryList:
      type: "array"
      items:
        type: "object"
    SetManagerRequest:
      type: "object"
      additionalProperties: false
      required:
        - "manager_id"
      properties:
        manager_id:
          type: "string"
          description: "Empty string clears the manager."
    LegalHoldRequest:
      type: "object"
      additionalProperties: false
      required:
        - "hold"
      properties:
        hold:
          type: "boolean"
        reason:
          type: "string"
    Erasure:
      type: "object"
      properties:
        subject:
          type: "string"
          pattern: "^pers_[0-9a-f]{24}$"
        classes:
          type: "array"
          items:
            type: "string"
        date:
          type: "string"
          format: "date"
    ErasureList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            type: "object"
            properties:
              seq:
                type: "integer"
              subject:
                type: "string"
              class:
                type: "string"
              date:
                type: "string"
                format: "date"
    RetentionReport:
      type: "object"
      properties:
        purged:
          type: "object"
        skipped_legal_hold:
          type: "object"
    OrgInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
      properties:
        name:
          type: "string"
        department_id:
          type: "string"
        lead_id:
          type: "string"
    OrgUnit:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        department_id:
          type: "string"
        lead_id:
          type: "string"
    OrgUnitList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/OrgUnit"
      required:
        - "items"
    TemplateInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "kind"
        - "items"
      properties:
        name:
          type: "string"
        kind:
          enum:
            - "onboarding"
            - "offboarding"
        auto_status:
          enum:
            - ""
            - "onboarding"
            - "offboarding"
        items:
          type: "array"
          minItems: 1
          maxItems: 50
          items:
            type: "object"
            required:
              - "title"
              - "assignee_role"
            properties:
              title:
                type: "string"
              assignee_role:
                enum:
                  - "self"
                  - "manager"
                  - "hr"
                  - "admin"
              due_offset_days:
                type: "integer"
              action:
                type: "string"
    Template:
      type: "object"
    TemplateList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Template"
      required:
        - "items"
    CreateChecklistRequest:
      type: "object"
      additionalProperties: false
      required:
        - "template_id"
      properties:
        template_id:
          type: "string"
        anchor_date:
          type: "string"
          format: "date"
    Checklist:
      type: "object"
    ChecklistList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Checklist"
      required:
        - "items"
    Task:
      type: "object"
    TaskList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Task"
      required:
        - "items"
    CreateSeriesRequest:
      type: "object"
      additionalProperties: false
      required:
        - "report_id"
        - "cadence"
      properties:
        report_id:
          type: "string"
          pattern: "^pers_[0-9a-f]{24}$"
        cadence:
          enum:
            - "weekly"
            - "biweekly"
            - "monthly"
    Series:
      type: "object"
    SeriesList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Series"
      required:
        - "items"
    MeetingSummary:
      type: "object"
    MeetingList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/MeetingSummary"
      required:
        - "items"
    Meeting:
      type: "object"
      description: "private_notes is present only for the manager of the series. Definitive shape: schemas/capabilities/*.v1.json."
    ScheduleMeetingRequest:
      type: "object"
      additionalProperties: false
      required:
        - "scheduled_at"
