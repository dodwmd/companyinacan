        carryover_cap_halves: { type: "integer", description: "omit for unlimited carry-over" }
        allow_negative: { type: "boolean" }
        negative_floor_halves: { type: "integer" }
        ignores_blackouts: { type: "boolean" }
        sets_leave_status: { type: "boolean" }
        leave_status_min_halves: { type: "integer" }
    LeaveTypePatch:
