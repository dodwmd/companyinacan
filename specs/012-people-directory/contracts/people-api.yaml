        cycle_id: { type: "string" }
        subject_id: { type: "string" }
        kind: { enum: ["peer", "upward"] }
        anonymous: { type: "boolean" }
        questions: { type: "array", items: { "$ref": "#/components/schemas/Question" } }
    AnswersIn:
      type: "object"
