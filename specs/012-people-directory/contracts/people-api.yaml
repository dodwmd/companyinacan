      type: "object"
      required: ["person_ids"]
      properties:
        person_ids: { type: "array", items: { type: "string" }, maxItems: 500 }
    ReviewIds:
      type: "object"
      properties:
        review_ids: { type: "array", items: { type: "string" } }
    ReviewSummary:
      type: "object"
      properties:
        id: { type: "string" }
        cycle_id: { type: "string" }
        person_id: { type: "string" }
        cycle_state: { type: "string" }
        status: { enum: ["in_progress", "self_submitted", "manager_submitted", "release_requested", "released", "acknowledged"] }
    Review:
      type: "object"
      description: "One review, filtered for the caller: parts the caller may not see are absent. peer_feedback and upward_feedback carry aggregates, and comments only for the manager and hr, only from min_responses answers, never attributed in an anonymous cycle."
      properties:
        id: { type: "string" }
        cycle_id: { type: "string" }
        person_id: { type: "string" }
        status: { type: "string" }
        self: { type: "object" }
        manager: { type: "object" }
        calibration: { type: "object", description: "hr only, never the subject" }
        outcome: { type: "object", properties: { rating: { type: "integer" }, summary: { type: "string" }, released: { type: "boolean" } } }
        peer_feedback: { "$ref": "#/components/schemas/FeedbackView" }
        upward_feedback: { "$ref": "#/components/schemas/FeedbackView" }
        goals: { type: "array", description: "read-only references to the subject's goals the caller may see", items: { type: "object" } }
    FeedbackView:
      type: "object"
      properties:
        kind: { enum: ["peer", "upward"] }
        shown: { type: "boolean" }
        required_responses: { type: "integer" }
        responses: { type: "integer" }
        ratings: { type: "array", items: { type: "object" } }
        comments: { type: "array", items: { type: "object" } }
    SelfIn:
      type: "object"
      properties:
        answers: { "$ref": "#/components/schemas/Answers" }
        submit: { type: "boolean" }
    ManagerIn:
      type: "object"
      properties:
        answers: { "$ref": "#/components/schemas/Answers" }
