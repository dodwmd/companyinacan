          type: "string"
        unit:
          type: "string"
        start_value:
          type: "number"
        target_value:
          type: "number"
    RecordProgressRequest:
      type: "object"
      additionalProperties: false
      required:
        - "value"
      properties:
        value:
          type: "number"
        comment:
          type: "string"
    Error:
      type: "object"
      required:
        - "code"
        - "message"
      properties:
        code:
          enum:
            - "invalid"
            - "unauthenticated"
            - "forbidden"
            - "not_found"
            - "conflict"
            - "internal"
        message:
          type: "string"
