# OpenAPI 3.1 contract of can-people. A contract test (test/contract/people_test.go) keeps it in step with the routes the service registers.
openapi: "3.1.0"
info:
  title: "can-people API"
  version: "0.1.0"
  license:
    name: "Apache-2.0"
    identifier: "Apache-2.0"
  description: "REST JSON API of the in-house people service: the `directory` and `performance` capabilities (people records, org structure, employment lifecycle, onboarding checklists, 1:1s, goals). Deny by default: every route needs a bearer token, and one policy layer decides per caller, per relationship and per field. Callers without visibility get 404 instead of 403 where a 403 would confirm that a record exists. This is a tool, not legal, HR or payroll advice; the operator is responsible for compliance with employment and data-protection law."
servers:
  - url: "http://people-api.mod-people.svc:8081"
    description: "ClusterIP only; there is no public listener"
security:
  - bearer: []
tags:
  - name: "directory"
  - name: "performance"
  - name: "platform"
paths:
  "/healthz":
    get:
      summary: "Liveness and database check"
      tags:
        - "platform"
      security: []
      responses:
        "200":
          description: "ok"
        "503":
          description: "database unavailable"
  "/v1/people":
    get:
      summary: "List the people the caller may see"
      description: "Who: any staff member (candidates and former people are visible to hr/admin and to the manager chain only)"
      tags:
        - "directory"
      parameters:
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Filter"
        - name: "department_id"
          in: "query"
          required: false
          schema:
            type: "string"
          description: ""
        - name: "team_id"
          in: "query"
          required: false
          schema:
            type: "string"
          description: ""
        - name: "manager_id"
          in: "query"
          required: false
          schema:
            type: "string"
          description: ""
        - name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Opaque cursor"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "1..100"
      responses:
        "200":
          description: "A page"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PersonList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
    post:
      summary: "Create a person"
      description: "Who: hr or admin"
      tags:
        - "directory"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreatePersonRequest"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Person"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/people/{id}":
    get:
      summary: "Get the basic (directory-basic) view"
      description: "Who: self, hr, admin, the manager chain, or any staff member for active/leave/onboarding people. Others get 404, never 403, so ids cannot be probed."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Person"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Person"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    patch:
      summary: "Change basic fields"
      description: "Who: hr or admin; a person may change only preferred_name and work_phone on their own record"
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: "Person"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Person"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/people/{id}/sensitive":
    get:
      summary: "Read people-sensitive fields"
      description: "Who: the person themself, hr, admin. Managers (direct or skip-level) never. Each call is audited per field before data is returned; if the audit hook fails the read fails. Query fields= selects fields; a requested field the caller may not read refuses the whole request (403)."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "fields"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Comma separated: date_of_birth, national_id, home_address, personal_phone, salary"
      responses:
        "200":
          description: "Only permitted fields"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SensitiveFields"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    put:
      summary: "Set or clear (null) sensitive fields"
      description: "Who: hr or admin; a person may write only home_address and personal_phone. All fields are authorised first; all or none are written."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PutSensitiveRequest"
      responses:
        "204":
          description: "Stored (encrypted)"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/people/{id}/status":
    post:
      summary: "Change employment status"
      description: "Who: hr or admin. Lifecycle candidate -> onboarding -> active <-> leave -> offboarding -> former (terminal). A future effective_date records a pending change; one pending change per person."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/StatusChangeRequest"
      responses:
        "200":
          description: "Person"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Person"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/people/{id}/status/pending":
    delete:
      summary: "Cancel the pending future-dated status change"
      description: "Who: hr or admin"
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Cancelled"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/people/{id}/history":
    get:
      summary: "Status history"
      description: "Who: the person themself, hr, admin"
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "History"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HistoryList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/people/{id}/manager":
    put:
      summary: "Set or clear the manager"
      description: "Who: hr or admin. Rejects self-management and any cycle in the reporting chain; the manager must be active or on leave."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SetManagerRequest"
      responses:
        "200":
          description: "Person"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Person"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/people/{id}/reports":
    get:
      summary: "Direct reports the caller may see"
      description: "Who: anyone who can see the person"
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Reports"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PersonList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/people/{id}/legal-hold":
    put:
      summary: "Place or lift a legal hold"
      description: "Who: hr or admin. A hold blocks erasure and retention purges."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LegalHoldRequest"
      responses:
        "204":
          description: "Done"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/people/{id}/erasure":
    post:
      summary: "Request erasure"
      description: "Who: hr or admin. Only former people and candidates; blocked (409) by a legal hold. Purges the five data classes, tombstones the subject and writes erasure ledger rows."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Tombstone"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Erasure"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/departments":
    get:
      summary: "List departments"
      description: "Who: any staff member or hr/admin"
      tags:
        - "directory"
      responses:
        "200":
          description: "Items"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnitList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
    post:
      summary: "Create (department)"
      description: "Who: hr or admin"
      tags:
        - "directory"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OrgInput"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnit"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/teams":
    get:
      summary: "List teams"
      description: "Who: any staff member or hr/admin"
      tags:
        - "directory"
      responses:
        "200":
          description: "Items"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnitList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
    post:
      summary: "Create (team)"
      description: "Who: hr or admin"
      tags:
        - "directory"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OrgInput"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnit"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/positions":
    get:
      summary: "List positions"
      description: "Who: any staff member or hr/admin"
      tags:
        - "directory"
      responses:
        "200":
          description: "Items"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnitList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
    post:
      summary: "Create (position)"
      description: "Who: hr or admin"
      tags:
        - "directory"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OrgInput"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnit"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/retention/run":
    post:
      summary: "Run the retention sweep now"
      description: "Who: hr or admin (the service also runs it hourly)"
      tags:
        - "directory"
      responses:
        "200":
          description: "Report"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RetentionReport"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/v1/erasures":
    get:
      summary: "Erasure tombstones (subject, class, date) for the E08 ledger"
      description: "Who: hr or admin (can-core's service account)"
      tags:
        - "directory"
      parameters:
        - name: "after"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Return entries with seq greater than this"
      responses:
        "200":
          description: "Entries"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErasureList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/v1/checklist-templates":
    get:
      summary: "List checklist templates"
      description: "Who: hr or admin"
      tags:
        - "directory"
      responses:
        "200":
          description: "Templates"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TemplateList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
    post:
      summary: "Create a checklist template"
      description: "Who: hr or admin"
      tags:
        - "directory"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Template"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/v1/people/{id}/checklists":
    post:
      summary: "Create a checklist from a template"
      description: "Who: hr or admin, or the person's direct manager"
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateChecklistRequest"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Checklist"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    get:
      summary: "List a person's checklists"
      description: "Who: the person themself, their direct manager, hr, admin"
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Checklists"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ChecklistList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/tasks":
    get:
      summary: "My open tasks"
      description: "Who: any staff member; hr/admin also see unassigned hr/admin tasks"
      tags:
        - "directory"
      responses:
        "200":
          description: "Tasks"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TaskList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/v1/tasks/{id}/complete":
    post:
      summary: "Complete a task"
      description: "Who: the assignee, hr or admin; everyone else gets 404. Emits checklist.task_completed.v1 (idempotent)."
      tags:
        - "directory"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Task"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Task"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/oneonones":
    post:
      summary: "Start a 1:1 series with a direct report"
      description: "Who: the report's current direct manager (role manager, status active)"
      tags:
        - "performance"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateSeriesRequest"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Series"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    get:
      summary: "My series"
      description: "Who: participants; a former manager no longer sees a series"
      tags:
        - "performance"
      responses:
        "200":
          description: "Series"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SeriesList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/oneonones/{id}/meetings":
    get:
      summary: "Meeting history of a series (schedule only)"
      description: "Who: the two participants; everyone else (HR and admin included) gets 404"
      tags:
        - "performance"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Meetings"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MeetingList"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    post:
      summary: "Schedule a meeting"
      description: "Who: participants. Emits oneonone.scheduled.v1."
      tags:
        - "performance"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ScheduleMeetingRequest"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MeetingSummary"
        "400":
          "$ref": "#/components/responses/Invalid"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/meetings/{id}":
    get:
      summary: "Meeting detail: agenda, shared notes, actions, follow-ups; private notes for the manager only"
      description: "Who: participants. Audited (fail closed). The report never sees a private_notes field."
      tags:
        - "performance"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Meeting"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Meeting"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    patch:
      summary: "Mark held, cancelled or scheduled"
      description: "Who: participants"
      tags:
        - "performance"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
