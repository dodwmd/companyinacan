        "204":
          description: "done"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/feedback-requests":
    get:
      summary: "List the feedback requests addressed to the caller"
      description: "Who the caller reviews and the questions. Nothing about who nominated them or who else was asked."
      tags:
        - "reviews"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/FeedbackRequest" } } } }
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/feedback-requests/{id}/answers":
    post:
      summary: "Answer a feedback request, once"
      description: "In an anonymous cycle the stored answer carries no reviewer and no timestamp"
      tags:
        - "reviews"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/AnswersIn" }
      responses:
        "204":
