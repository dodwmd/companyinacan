        owner_id:
          type: "string"
          pattern: "^pers_[0-9a-f]{24}$"
        team_id:
          type: "string"
        title:
          type: "string"
        description:
          type: "string"
        period:
          type: "string"
        visibility:
          enum:
            - "private"
            - "manager"
            - "team"
            - "company"
        status:
          enum:
            - "draft"
            - "active"
            - "achieved"
            - "abandoned"
        parent_id:
          type: "string"
    UpdateGoalRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: "string"
        description:
          type: "string"
        period:
          type: "string"
        visibility:
          enum:
            - "private"
            - "manager"
            - "team"
            - "company"
        status:
          enum:
            - "draft"
            - "active"
            - "achieved"
            - "abandoned"
        parent_id:
          type: "string"
    Goal:
      type: "object"
    GoalList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Goal"
      required:
        - "items"
    GoalUpdateList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Goal"
      required:
        - "items"
    KeyResult:
      type: "object"
    CreateKeyResultRequest:
      type: "object"
      additionalProperties: false
      required:
