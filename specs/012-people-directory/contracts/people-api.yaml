        "400":
          "$ref": "#/components/responses/Invalid"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-types":
    get:
      summary: "List the leave types"
      description: "Who: any staff member"
      tags:
        - "timeoff"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/LeaveType" } } } }
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
    post:
      summary: "Define a leave type and its accrual policy"
      description: "Who: hr or admin. Units are half days. Entitlements and statutory rules vary by jurisdiction: this is data the operator enters, not a rule engine."
      tags:
        - "timeoff"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/LeaveTypeIn" }
      responses:
        "201":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveType" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/leave-types/{id}":
    patch:
      summary: "Change the policy of a leave type"
      description: "Who: hr or admin. Existing ledger entries are not rewritten."
      tags:
        - "timeoff"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/LeaveTypePatch" }
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/LeaveType" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/holiday-calendars":
    get:
      summary: "List the public holiday calendars"
      description: "Who: any staff member"
      tags:
        - "timeoff"
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { type: "object", properties: { items: { type: "array", items: { "$ref": "#/components/schemas/HolidayCalendar" } } } }
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
    post:
      summary: "Create or replace the calendar of a location"
      description: "Who: hr or admin. Matched to a person's location (case-folded). Includes the work week."
      tags:
        - "timeoff"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/HolidayCalendarIn" }
      responses:
        "200":
          description: "ok"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/HolidayCalendar" }
        "400":
          "$ref": "#/components/responses/Invalid"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
  "/v1/blackouts":
    get:
      summary: "List blackout periods"
      description: "Who: any staff member"
      tags:
        - "timeoff"
      responses:
        "200":
          description: "ok"
