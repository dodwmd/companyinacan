      summary: "Get a party (audited read)"
      operationId: GET_v1_parties_id
      x-scope: finance.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
