        "400": { description: "Malformed JSON, unknown field, bad If-Match or cursor" }
        "401": { description: "No valid credentials" }
        "403": { description: "Missing scope, or separation of duties" }
        "404": { description: "Not found, or outside the token's scope" }
        "409": { description: "State conflict (for example an issued invoice)" }
        "412": { description: "If-Match version is stale" }
        "422": { description: "Invalid fields" }
        "429": { description: "Rate limited" }
  /v1/tax-rates/{code}:
    patch:
