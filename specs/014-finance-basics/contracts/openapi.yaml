openapi: 3.1.0
info:
  title: can-finance API
  version: 0.1.0
  description: >-
    REST API of the in-house finance module (specs/014-finance-basics). Money is an integer count of
    the currency's minor unit, never a float. Bearer API tokens with scopes finance.read, finance.write,
    finance.approve and finance.admin, optionally limited to parties and projects; an out-of-scope record
    is a 404, like a missing one. Records carry a version (the ETag): send If-Match to detect concurrent
    edits (412). Creates accept an Idempotency-Key header. The creator of a record cannot approve it (403
    separation_of_duties). A tool, not accounting, tax or legal advice.
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://finance:8080
security:
  - bearer: []
paths:
  /v1/me:
    get:
      summary: "Who the token is: subject, scopes, parties, projects, own_only"
      operationId: GET_v1_me
      x-scope: finance.read
      x-own-only-allowed: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400": { description: "Malformed JSON, unknown field, bad If-Match or cursor" }
        "401": { description: "No valid credentials" }
        "403": { description: "Missing scope, or separation of duties" }
        "404": { description: "Not found, or outside the token's scope" }
        "409": { description: "State conflict (for example an issued invoice)" }
        "412": { description: "If-Match version is stale" }
        "422": { description: "Invalid fields" }
        "429": { description: "Rate limited" }
  /v1/parties:
    get:
      summary: "List customers and vendors in scope (audited read)"
      operationId: GET_v1_parties
      x-scope: finance.read
      responses:
        "200":
          description: OK
