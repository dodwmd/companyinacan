openapi: 3.1.0
info:
  title: can-finance API
  version: 0.1.0
  description: >-
    REST API of the in-house finance module (specs/014-finance-basics). Money is an integer count of
    the currency's minor unit, never a float. Bearer API tokens with scopes finance.read, finance.write,
    finance.approve and finance.admin, optionally limited to parties and projects; an out-of-scope record
    is a 404, like a missing one. Records carry a version (the ETag): send If-Match to detect concurrent
    edits (412). Creates accept an Idempotency-Key header. The creator of a record cannot approve it (403
    separation_of_duties). A tool, not accounting, tax or legal advice.
  license: { name: Apache-2.0, identifier: Apache-2.0 }
servers:
  - url: http://finance:8080
security:
  - bearer: []
paths:
  /v1/me:
    get:
      summary: "Who the token is: subject, scopes, parties, projects, own_only"
      operationId: GET_v1_me
      x-scope: finance.read
      x-own-only-allowed: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400": { description: "Malformed JSON, unknown field, bad If-Match or cursor" }
        "401": { description: "No valid credentials" }
        "403": { description: "Missing scope, or separation of duties" }
        "404": { description: "Not found, or outside the token's scope" }
        "409": { description: "State conflict (for example an issued invoice)" }
        "412": { description: "If-Match version is stale" }
        "422": { description: "Invalid fields" }
        "429": { description: "Rate limited" }
  /v1/import/parties:
    post:
      summary: "Preview or apply a CSV of customers and vendors (specs/047-csv-import)"
      operationId: POST_v1_import_parties
      x-scope: finance.write
      description: "Not for tokens limited to parties, projects or own records. All or nothing; at most 1 MiB and 2000 rows."
      parameters:
        - { name: apply, in: query, required: false, schema: { type: boolean }, description: "Write; without it nothing is written" }
        - { name: map, in: query, required: false, schema: { type: array, items: { type: string } }, description: "<field>=<column header>" }
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200": { description: "The report of a preview, or of an applied import" }
        "400": { description: "The file or a query parameter is unusable" }
        "401": { description: "No valid credentials" }
        "403": { description: "Missing scope, or a limited token" }
        "409": { description: "Another import is running" }
        "413": { description: "Over the size or row limit" }
        "422": { description: "apply=true and a row has an error: the report; nothing was written" }
        "429": { description: "Rate limited" }
  /v1/parties:
    get:
      summary: "List customers and vendors in scope (audited read)"
      operationId: GET_v1_parties
      x-scope: finance.read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400": { description: "Malformed JSON, unknown field, bad If-Match or cursor" }
        "401": { description: "No valid credentials" }
        "403": { description: "Missing scope, or separation of duties" }
        "404": { description: "Not found, or outside the token's scope" }
        "409": { description: "State conflict (for example an issued invoice)" }
        "412": { description: "If-Match version is stale" }
        "422": { description: "Invalid fields" }
        "429": { description: "Rate limited" }
    post:
      summary: "Create a party"
      operationId: POST_v1_parties
      x-scope: finance.write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400": { description: "Malformed JSON, unknown field, bad If-Match or cursor" }
        "401": { description: "No valid credentials" }
        "403": { description: "Missing scope, or separation of duties" }
        "404": { description: "Not found, or outside the token's scope" }
        "409": { description: "State conflict (for example an issued invoice)" }
        "412": { description: "If-Match version is stale" }
        "422": { description: "Invalid fields" }
        "429": { description: "Rate limited" }
