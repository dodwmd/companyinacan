 "info": {
  "title": "can-board API (board, resolutions and entity capabilities)",
  "version": "0.1.0",
  "description": "REST JSON surface of the in-house board and entity service (modules `board` and `entity`, one binary, one listener). THIS IS A TOOL, NOT LEGAL ADVICE: jurisdiction-specific rules (quorum and notice law, who must sign, which registers a company must keep, filing deadlines, director duties) are not implemented; they are data the operator enters. Board materials are confidential: every route authenticates first and the service decides per caller, per record and per field; a caller who may not see a record gets 404 (indistinguishable from a missing one), a caller who may see it but not do the thing gets 403. Reads of sensitive fields are audited before data is returned (fail closed). Creates accept an Idempotency-Key header. Events carry ids, dates and the result only."
 },
