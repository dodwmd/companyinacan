        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
    Me: { type: object, properties: { subject: { type: string }, kind: { type: string }, token_id: { type: string }, role: { enum: [admin, recruiter, hiring_manager, interviewer] }, jobs: { type: array, items: { type: string } } } }
    Ok: { type: object, properties: { ok: { type: boolean } } }
    Generic: { type: object }
    JobPostings: { type: array, items: { type: object } }
    Job: { $ref: "../../../schemas/capabilities/jobs.v1.json#/$defs/Job" }
    JobList: { $ref: "../../../schemas/capabilities/jobs.v1.json#/$defs/JobList" }
    NewJob: { $ref: "../../../schemas/capabilities/jobs.v1.json#/$defs/NewJob" }
    JobPatch: { type: object, description: Any NewJob field except valid_through semantics (a date); clear_salary removes the pay range }
    TransitionRequest: { $ref: "../../../schemas/capabilities/jobs.v1.json#/$defs/TransitionRequest" }
    ApprovalDecision: { type: object, required: [decision], properties: { decision: { enum: [approve, reject] } } }
    BoardList: { $ref: "../../../schemas/capabilities/jobs.v1.json#/$defs/BoardList" }
    BoardStateList: { type: object, properties: { items: { type: array, items: { type: object } } } }
    StageList: { type: object, properties: { items: { type: array, items: { type: object, required: [key, name, kind], properties: { key: { type: string }, name: { type: string }, kind: { enum: [initial, active, offer, hired] }, position: { type: integer } } } } } }
    Application: { $ref: "../../../schemas/capabilities/ats.v1.json#/$defs/Application" }
    ApplicationList: { $ref: "../../../schemas/capabilities/ats.v1.json#/$defs/ApplicationList" }
    ManualApplication: { type: object, required: [job_id, name, email, consent_recorded], properties: { job_id: { type: string }, name: { type: string }, email: { type: string }, phone: { type: string }, cover_letter: { type: string }, source: { type: string }, consent_recorded: { type: boolean }, talent_pool: { type: boolean } } }
    MoveRequest: { $ref: "../../../schemas/capabilities/ats.v1.json#/$defs/MoveRequest" }
    RejectRequest: { $ref: "../../../schemas/capabilities/ats.v1.json#/$defs/RejectRequest" }
    Scorecard: { type: object, properties: { id: { type: string }, application_id: { type: string }, author: { type: string }, rating: { type: integer, minimum: 1, maximum: 4 }, recommendation: { enum: [strong_no, no, yes, strong_yes] }, comments: { type: string }, status: { enum: [draft, submitted] }, submitted_at: { type: [string, "null"] } } }
    ScorecardInput: { type: object, required: [rating, recommendation], properties: { rating: { type: integer, minimum: 1, maximum: 4 }, recommendation: { enum: [strong_no, no, yes, strong_yes] }, comments: { type: string, maxLength: 5000 } } }
    ScorecardList: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Scorecard" } }, others_hidden: { type: boolean } } }
    Candidate: { $ref: "../../../schemas/capabilities/ats.v1.json#/$defs/Candidate" }
    CandidateList: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Candidate" } }, next_cursor: { type: string } } }
    CandidatePatch: { type: object, properties: { tags: { type: array, items: { type: string } }, notes: { type: string }, address: { type: string }, salary_expectation: { type: string }, phone: { type: string } } }
    TalentPoolRequest: { type: object, required: [member], properties: { member: { type: boolean } } }
    LegalHoldRequest: { type: object, required: [hold], properties: { hold: { type: boolean } } }
    PurgeRequest: { type: object, required: [subject, class], properties: { subject: { type: string, pattern: "^cand_[0-9a-f]{16}$" }, class: { enum: [candidate-pii, candidate-resumes, candidate-evaluations] } } }
    Erasure: { type: object, properties: { subject: { type: string }, classes: { type: array, items: { type: string } }, date: { type: string } } }
    ErasureList: { type: object, properties: { items: { type: array, items: { type: object, properties: { seq: { type: integer }, subject: { type: string }, class: { type: string }, date: { type: string } } } } } }
    RetentionReport: { type: object, properties: { candidates_purged: { type: integer }, skipped_legal_hold: { type: integer }, jobs_expired: { type: integer }, jobs_deleted: { type: integer }, eeo_deleted: { type: integer } } }
    EEOReport: { type: object, description: "Counts per answer; count is null when the cell has fewer than min_cell responses.", properties: { job_id: { type: string }, responses: { type: [integer, "null"] }, min_cell: { type: integer }, fields: { type: object } } }
    NewToken: { type: object, required: [kind, subject, name, role], properties: { kind: { enum: [personal, service] }, subject: { type: string }, name: { type: string }, role: { enum: [admin, recruiter, hiring_manager, interviewer] }, jobs: { type: array, items: { type: string } }, expires_at: { type: [string, "null"] } } }
    TokenCreated: { type: object, properties: { token: { type: object }, secret: { type: string, description: Shown once } } }
    TokenList: { type: object, properties: { items: { type: array, items: { type: object } } } }
    AuditList: { type: object, properties: { items: { type: array, items: { type: object } }, next_cursor: { type: string } } }
