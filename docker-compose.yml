# Company in a Can: the whole stack on one machine WITHOUT Kubernetes. DEV ONLY.
#
#   docker compose up --build        (or: make compose-up)
#
# Works with docker compose v2 and podman-compose. See docs/local-compose.md.
#
# WARNING: insecure dev defaults (public fake tokens in dev/compose/secrets/, plain HTTP, no
# TLS, fake token review in can-core, module identities read from files, unpinned base-image
# tags). Never expose this stack. The edge listens on 127.0.0.1 only; keep it that way.
#
# Rootless podman note: every container is configured by files baked into its image (no bind
# mounts), so SELinux relabelling (:z) is not needed.

name: companyinacan

x-build-args: &build-args
  GO_IMAGE: ${GO_IMAGE:-docker.io/library/golang:1.27}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
  EDGE_IMAGE: ${EDGE_IMAGE:-docker.io/library/caddy:2.8-alpine}

# Metrics (epic E22): every service has a dedicated listener on 9190 that is reachable only on the private
# compose network (no port is published) and needs this bearer token. A PUBLIC DEV TOKEN, like the others
# here. Prometheus and Grafana are NOT started by default: `docker compose --profile monitoring up -d`.
x-metrics-env: &metrics-env
  CAN_METRICS_ADDR: "0.0.0.0:9190"
  CAN_METRICS_TOKEN: dev-only-metrics-token-0123456789abcdef

# A PUBLIC DEV secret: can-core signs the events it delivers to jobs, finance and people with it. Those three
# also carry the in-cluster names can-core delivers to as network aliases.
x-webhook-secret: &webhook-secret dev-only-webhook-secret-0123456789abcdef

# forms, work, people, jobs, finance, equity and files ask can-core (CAN_API_URL) who a personal access token or a launch
# ticket belongs to, presenting the random token the `init` job wrote for each (CAN_TOKEN_FILE). Each module
# mounts only its own token volume.
services:
  # One-shot: dev keyrings for people/jobs/files and the can-core admin account. Prints the TOTP secret.
  init:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: init, args: *build-args }
    container_name: can-init
    env_file: [dev/compose/secrets/core.env]
    volumes:
      - dev-secrets:/secrets
      - core-data:/var/lib/can
      - token-forms:/tokens/forms
      - token-work:/tokens/work
      - token-people:/tokens/people
      - token-jobs:/tokens/jobs
      - token-finance:/tokens/finance
      - token-equity:/tokens/equity
      - token-files:/tokens/files
    restart: "no"

  site:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: site, args: *build-args }
    container_name: can-site
    environment: *metrics-env
    healthcheck:
      test: ["CMD", "/can-static", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  forms:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: forms, args: *build-args }
    container_name: can-forms
    networks: { default: { aliases: [forms-api.mod-forms.svc.cluster.local] } }
    env_file: [dev/compose/secrets/forms.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: forms
      CAN_TOKEN_FILE: /tokens/token
      CAN_RAM_DECLARED_MB: "15"
    volumes:
      - forms-data:/data
      - token-forms:/tokens:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-forms", "healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  core:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: core, args: *build-args }
    container_name: can-core
    environment:
      CAN_INSTALLER: none          # no cluster: nothing is deployed
      # DEV ONLY, refused by every release build: record modules as installed and know them by the token
      # files, so the catalogue, personal access tokens and the Apps launcher work.
      CAN_DEV_STACK: "true"
      CAN_DEV_MODULE_TOKEN_DIR: /tokens
      CAN_DEV_WEBHOOK_SECRET: *webhook-secret
      CAN_COMPANY_FILE: /var/lib/can/company/company.yaml
      # Where Apps sends the browser. One host name (localhost) on different ports, because the launch
      # cookie of plain http is host-only: open the admin UI at http://localhost:8180 for this.
      CAN_MODULE_UI_URLS: "work=http://localhost:8181/ui,people=http://localhost:8182,jobs=http://localhost:8183,finance=http://localhost:8184,files=http://localhost:8185,equity=http://localhost:8186"
      CAN_TOKEN_REVIEW: fake       # DEV ONLY: module tokens are not verified against Kubernetes
      CAN_COOKIE_SECURE: "false"   # plain HTTP on localhost
      CAN_TRUST_PROXY: "true"      # behind the Caddy edge
      CAN_COMPANY_NAME: Acme Co
      CAN_COMPANY_DOMAIN: acme.example
      <<: *metrics-env
      CAN_RAM_DECLARED_MB: "48"
      # email.send (docs/email.md): the sink below is a private address without TLS, both refused unless
      # these DEV ONLY switches are set.
      CAN_SMTP_ALLOW_INSECURE: "true"
      CAN_SMTP_ALLOW_PRIVATE: "true"
    volumes:
      - core-data:/var/lib/can
      - token-forms:/tokens/forms:ro
      - token-work:/tokens/work:ro
      - token-people:/tokens/people:ro
      - token-jobs:/tokens/jobs:ro
      - token-finance:/tokens/finance:ro
      - token-equity:/tokens/equity:ro
      - token-files:/tokens/files:ro
    depends_on:
      init:
        condition: service_completed_successfully
    # No healthcheck of its own (distroless, no probe flag): the smoke test checks it via the edge.
    restart: unless-stopped

  # DEV ONLY SMTP server that keeps mail instead of delivering it: http://mail.localhost:8080/messages
  smtpsink:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: smtpsink, args: *build-args }
    container_name: can-smtpsink
    healthcheck:
      test: ["CMD", "/smtpsink", "-healthcheck", "127.0.0.1:8025"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  work:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: work, args: *build-args }
    container_name: can-work
    networks: { default: { aliases: [work.mod-work.svc.cluster.local] } }   # the business overview asks it
    env_file: [dev/compose/secrets/work.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: work
      CAN_TOKEN_FILE: /tokens/token
      CAN_RAM_DECLARED_MB: "20"
    volumes:
      - work-data:/data
      - token-work:/tokens:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-work", "healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  people:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: people, args: *build-args }
    container_name: can-people
    networks: { default: { aliases: [people-api.mod-people.svc.cluster.local] } }
    env_file: [dev/compose/secrets/people.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: people
      CAN_TOKEN_FILE: /tokens/token
      CAN_WEBHOOK_SECRET: *webhook-secret
      CAN_RAM_DECLARED_MB: "30"
    volumes:
      - people-data:/data
      - token-people:/tokens:ro
      - dev-secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-people", "healthcheck", "-addr", "127.0.0.1:8081"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jobs:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: jobs, args: *build-args }
    container_name: can-jobs
    networks: { default: { aliases: [jobs.mod-jobs.svc.cluster.local] } }
    env_file: [dev/compose/secrets/jobs.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: jobs
      CAN_TOKEN_FILE: /tokens/token
      CAN_WEBHOOK_SECRET: *webhook-secret
      CAN_RAM_DECLARED_MB: "30"
    volumes:
      - jobs-data:/data
      - token-jobs:/tokens:ro
      - dev-secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-jobs", "healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  finance:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: finance, args: *build-args }
    container_name: can-finance
    networks: { default: { aliases: [finance.mod-finance.svc.cluster.local] } }
    env_file: [dev/compose/secrets/finance.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: finance
      CAN_TOKEN_FILE: /tokens/token
      CAN_WEBHOOK_SECRET: *webhook-secret
      CAN_RAM_DECLARED_MB: "20"
    volumes:
      - finance-data:/data
      - token-finance:/tokens:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-finance", "healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  equity:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: equity, args: *build-args }
    container_name: can-equity
    networks: { default: { aliases: [equity-api.mod-equity.svc.cluster.local] } }
    env_file: [dev/compose/secrets/equity.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: equity
      CAN_TOKEN_FILE: /tokens/token
      CAN_RAM_DECLARED_MB: "16"
    volumes:
      - equity-data:/data
      - token-equity:/tokens:ro
      - dev-secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-equity", "healthcheck", "-addr", "127.0.0.1:8081"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  files:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: files, args: *build-args }
    container_name: can-files
    networks: { default: { aliases: [files.mod-files.svc.cluster.local] } }
    env_file: [dev/compose/secrets/files.env]
    environment:
      <<: *metrics-env
      CAN_API_URL: "http://core:8090"
      CAN_MODULE_ID: files
      CAN_TOKEN_FILE: /tokens/token
      CAN_RAM_DECLARED_MB: "28"
    volumes:
      - files-data:/data
      - token-files:/tokens:ro
      - dev-secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/can-files", "healthcheck", "-addr", "127.0.0.1:8095"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  edge:
    build: { context: ., dockerfile: dev/compose/Dockerfile, target: edge, args: *build-args }
    container_name: can-edge
    ports:
      - "127.0.0.1:8080:8080"
      # The admin UI and the module web UIs on one host name, for the Apps launcher (see core above).
      - "127.0.0.1:8180:8180"  # admin
      - "127.0.0.1:8181:8181"  # work
      - "127.0.0.1:8182:8182"  # people
      - "127.0.0.1:8183:8183"  # jobs
      - "127.0.0.1:8184:8184"  # finance
      - "127.0.0.1:8185:8185"  # files
      - "127.0.0.1:8186:8186"  # equity
    depends_on: [site, forms, core, work, people, jobs, finance, equity, files, smtpsink]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/_edge/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- optional: `docker compose --profile monitoring up -d` (docs/observability.md) ----------------------
  # Pinned tags (digests are not pinned: dev only). Both listen on 127.0.0.1 only.
  prometheus:
    profiles: [monitoring]
    build: { context: ., dockerfile: dev/compose/monitoring/Dockerfile.prometheus }
    image: companyinacan-prometheus:v2.55.1
    container_name: can-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    build: { context: ., dockerfile: dev/compose/monitoring/Dockerfile.grafana }
    image: companyinacan-grafana:11.3.1
    container_name: can-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: dev-only-grafana-password   # DEV ONLY, public
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

# Named volumes: `down` keeps them, `down -v` deletes them.
volumes:
  dev-secrets:
  token-forms:
  token-work:
  token-people:
  token-jobs:
  token-finance:
  token-equity:
  token-files:
  core-data:
  forms-data:
  work-data:
  people-data:
  jobs-data:
  finance-data:
  prometheus-data:
  equity-data:
  files-data:
