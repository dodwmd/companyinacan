name: dev-cluster

# Not a required check (continue-on-error). Runs the cluster-backed tests on a real k3d cluster:
# the E02 platform tests, and (epic E03 part 2) can-core built from this checkout, deployed into the
# cluster, driving a stub module through enable -> upgrade -> disable -> re-enable with a real
# projected ServiceAccount token, plus the admission policy and database provisioner tests.
# Kept out of ci.yml so it cannot affect the required job names.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/**"
      - "dev/**"
      - "core/**"
      - "cmd/**"
      - "modules/**"
      - "go.mod"
      - "go.sum"
      - "test/integration/**"
      - ".github/workflows/dev-cluster.yml"

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install k3d
        # Pinned release binary, verified against its published sha256 (checksums.txt of v5.8.3).
        run: |
          curl -fsSL -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: Create the cluster
        run: make dev
      - name: Build the can-core image and import it into the cluster
        # The release Dockerfile pins base images by digest (placeholders until a release); the
        # throwaway cluster uses plain tags. The test layer adds the stub module under /modules.
        run: |
          docker build -f deploy/can-core/Dockerfile \
            --build-arg GO_IMAGE=golang:1.27 \
            --build-arg RUNTIME_IMAGE=gcr.io/distroless/static-debian12:nonroot \
            -t can-core:base .
          docker build -f test/integration/testdata/Dockerfile.can-core-test \
            --build-arg BASE=can-core:base -t can-core:dev test/integration/testdata
          k3d image import can-core:dev -c companyinacan-dev
      - name: Deploy can-core
        run: |
          kubectl --context k3d-companyinacan-dev apply -k deploy/can-core
          kubectl --context k3d-companyinacan-dev -n can-system rollout status deploy/can-core --timeout=180s
      - name: Integration tests
        env:
          CAN_IT_CANCORE: "1"
        run: go test -tags integration -count=1 -v -timeout 25m ./test/integration/...
      - name: Measure can-core memory in the cluster
        if: always()
        run: |
          kubectl --context k3d-companyinacan-dev -n can-system get pod -l app.kubernetes.io/name=can-core -o wide || true
          # the image has no shell: read the process RSS from the node
          docker exec k3d-companyinacan-dev-server-0 sh -c 'for p in $(pidof can-core); do grep -E "VmRSS|VmHWM" /proc/$p/status; done' || true
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context k3d-companyinacan-dev get pods,svc,networkpolicy -A || true
          kubectl --context k3d-companyinacan-dev -n kube-system logs deployment/coredns --tail=50 || true
          kubectl --context k3d-companyinacan-dev -n can-system logs deploy/can-core --tail=200 || true
          kubectl --context k3d-companyinacan-dev -n can-system describe pod -l app.kubernetes.io/name=can-core || true
          kubectl --context k3d-companyinacan-dev get ns,validatingadmissionpolicy,validatingadmissionpolicybinding || true
          kubectl --context k3d-companyinacan-dev -n mod-stub get all,netpol,quota -o wide || true
          kubectl --context k3d-companyinacan-dev -n mod-stub logs deploy/stub --tail=40 || true
      - name: Delete the cluster
        if: always()
        run: go run ./cmd/can dev down
