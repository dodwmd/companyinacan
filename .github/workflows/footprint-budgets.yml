name: footprint-budgets

# Footprint regression check (docs/measurements/footprint.md). NOT a required check: the job is
# continue-on-error and absent from scripts/gh-protect-main.sh. It compares binary sizes, and the
# anonymous memory of every container of the compose stack when idle and after the end-to-end
# suite, with the per-service budgets of dev/footprint/budgets.json. An exceeded budget fails the
# step and is annotated with the service and the numbers.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "dev/compose/**"
      - "dev/footprint/budgets.json"
      - "dev/footprint/composecheck/**"
      - "core/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/footprint-budgets.yml"

permissions:
  contents: read

concurrency:
  group: footprint-budgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budgets:
    name: footprint-budgets
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Binary sizes against budgets
        run: |
          set -o pipefail
          mkdir -p out/bin
          for b in can-core can-static can-forms can-work can-people can-jobs can-finance can-equity can-files can-board can-provision; do
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "out/bin/$b" "./cmd/$b"
          done
          go run ./dev/footprint/composecheck -bin-dir out/bin | tee out/binaries.txt
      - name: Build and start the stack
        if: success() || failure()
        run: make e2e-up
      - name: Idle memory against budgets
        id: idle
        if: success() || failure()
        run: |
          set -o pipefail
          sleep 30
          go run ./dev/footprint/composecheck -project can-e2e -phase idle -state out/containers.json | tee out/idle.txt
      - name: End-to-end suite (the load)
        if: success() || failure()
        # No restart test here: it recreates every container, and "loaded" would then describe fresh
        # processes (composecheck fails if that happens). e2e.yml still runs the restart test.
        env:
          E2E_RESTART: "0"
        run: make e2e
      - name: Memory after load against budgets
        if: success() || failure()
        run: |
          set -o pipefail
          go run ./dev/footprint/composecheck -project can-e2e -phase loaded -state out/containers.json | tee out/loaded.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Footprint budgets (advisory)"
            for f in binaries idle loaded; do
              if [ -f "out/$f.txt" ]; then echo "#### $f"; echo '```'; cat "out/$f.txt"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: footprint-budgets
          path: out/*.txt
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make e2e-down
