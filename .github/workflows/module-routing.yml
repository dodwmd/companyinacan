name: module-routing

# Not a required check (continue-on-error). specs/040-module-routing on a real k3d cluster: the
# admission policy's refusals, and end to end through Traefik on port 443: work enabled with its UI
# and forms, an admin login, the Apps launcher, a launch ticket redeemed into a work session and a
# public form post that becomes a lead. specs/045-public-access: the HTTPS redirect, the sign-in
# limit against spoofed forwarding headers and finance's signed-link path.
# Certificates are Traefik's self-signed default; no ACME, no browser; people and jobs are not run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/**"
      - "dev/**"
      - "core/**"
      - "cmd/**"
      - "modules/**"
      - "go.mod"
      - "go.sum"
      - "test/integration/**"
      - ".github/workflows/module-routing.yml"

permissions:
  contents: read

jobs:
  routing:
    name: routing
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install k3d
        # Pinned release binary, verified against its published sha256 (checksums.txt of v5.8.3).
        run: |
          curl -fsSL -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: Create the cluster
        run: make dev
      - name: Build can-core and the module images and import them
        # Base images by tag or by today's digest: the release pins are placeholders.
        run: |
          docker build -f deploy/can-core/Dockerfile \
            --build-arg GO_IMAGE=golang:1.27 \
            --build-arg RUNTIME_IMAGE=gcr.io/distroless/static-debian12:nonroot \
            -t can-core:dev .
          docker pull -q golang:1.27 >/dev/null
          docker pull -q gcr.io/distroless/static-debian12:nonroot >/dev/null
          GO_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' golang:1.27 | cut -d@ -f2)
          DL_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' gcr.io/distroless/static-debian12:nonroot | cut -d@ -f2)
          for m in work forms finance; do
            # the tag the chart asks for (modules/$m/chart/values.yaml)
            tag="$(awk '/^  tag:/ {print $2; exit}' "modules/$m/chart/values.yaml")"
            docker build -f deploy/$m/Dockerfile \
              --build-arg GO_IMAGE_DIGEST="$GO_DIGEST" \
              --build-arg DISTROLESS_DIGEST="$DL_DIGEST" \
              --build-arg VERSION=ci \
              -t "ghcr.io/dodwmd/can-$m:$tag" .
          done
          k3d image import can-core:dev ghcr.io/dodwmd/can-work:0.1.0 ghcr.io/dodwmd/can-forms:0.3.0 \
            ghcr.io/dodwmd/can-finance:0.1.0 -c companyinacan-dev
      - name: Deploy can-core
        run: |
          kubectl --context k3d-companyinacan-dev apply -k deploy/can-core
          kubectl --context k3d-companyinacan-dev -n can-system rollout status deploy/can-core --timeout=180s
      - name: Admission policy and routing end to end
        env:
          CAN_IT_CANCORE: "1"
          CAN_IT_ROUTING: "1"
        run: go test -tags integration -count=1 -v -timeout 28m -run 'TestTraefikHasTheACMEResolver|TestAdmissionPolicyRoutes|TestModuleRoutingThroughTheIngress' ./test/integration/
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context k3d-companyinacan-dev get pods,svc,networkpolicy -A || true
          kubectl --context k3d-companyinacan-dev get validatingadmissionpolicy -o yaml || true
          kubectl --context k3d-companyinacan-dev -n can-system logs deploy/can-core --tail=200 || true
      - name: Delete the cluster
        if: always()
        run: go run ./cmd/can dev down
