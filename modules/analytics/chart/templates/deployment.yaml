apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mod.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate   # SQLite on a ReadWriteOnce volume: exactly one writer, never two pods
  selector:
    matchLabels:
      {{- include "mod.selector" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "mod.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "mod.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -listen
            - ":{{ .Values.service.port }}"
            # `proxy`: plain HTTP behind Traefik, which terminates TLS; `http` on local dev.
            - -tls
            - {{ ternary .Values.goatcounter.tlsMode "http" .Values.ingress.tls }}
            - -db
            - sqlite+{{ .Values.persistence.mountPath }}/goatcounter.sqlite3
            - -automigrate
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: {{ .Values.probes.readiness.port }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: {{ .Values.probes.liveness.port }}}
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: {{ .Values.persistence.mountPath }}}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Chart.Name }}-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
