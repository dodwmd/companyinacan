apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mod.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate   # SQLite on a ReadWriteOnce volume: exactly one writer, never two pods
  selector:
    matchLabels:
      {{- include "mod.selector" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "mod.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $host := required "ingress.host is supplied by can-core" .Values.ingress.host }}
      {{- $email := default (printf "admin@%s" (trimPrefix "stats." $host)) .Values.settings.admin_email }}
      initContainers:
        # Creates the first site and its user once, with the password can-core generated, so the server
        # never runs without an account. GoatCounter takes a password on its command line only (or from
        # a terminal): it is visible in the process list of this short-lived container.
        - name: site
          image: {{ include "mod.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              db="sqlite+{{ .Values.persistence.mountPath }}/goatcounter.sqlite3"
              if [ -f "{{ .Values.persistence.mountPath }}/goatcounter.sqlite3" ]; then
                goatcounter db migrate all -db "$db"
                if goatcounter db show site -find "$SITE_HOST" -db "$db" >/dev/null 2>&1; then
                  echo "site $SITE_HOST exists"
                  exit 0
                fi
              fi
              goatcounter db create site -createdb -vhost "$SITE_HOST" \
                -user.email "$ADMIN_EMAIL" -user.password "$CAN_ANALYTICS_ADMIN_PASSWORD" -db "$db"
              echo "site $SITE_HOST created"
          env:
            - {name: SITE_HOST, value: {{ $host | quote }}}
            - {name: ADMIN_EMAIL, value: {{ $email | quote }}}
            - name: CAN_ANALYTICS_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.module }}, key: CAN_ANALYTICS_ADMIN_PASSWORD}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: {{ .Values.persistence.mountPath }}}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: app
          image: {{ include "mod.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -listen
            - ":{{ .Values.service.port }}"
            # Plain HTTP: Traefik terminates TLS and sets X-Forwarded-Proto.
            - -tls
            - http
            - -db
            - sqlite+{{ .Values.persistence.mountPath }}/goatcounter.sqlite3
            - -automigrate
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
          env:
            - {name: GOMEMLIMIT, value: {{ .Values.goMemLimit | quote }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: {{ .Values.probes.readiness.port }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: {{ .Values.probes.liveness.port }}}
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: {{ .Values.persistence.mountPath }}}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Chart.Name }}-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
