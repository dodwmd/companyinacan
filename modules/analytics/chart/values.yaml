# Values for the analytics module chart (GoatCounter, SQLite). can-core supplies ingress.host
# (<subdomain>.<domain>); see specs/007-starter-modules/contracts/module-charts.md.
image:
  repository: docker.io/arp242/goatcounter
  tag: "2.7.0"
  # Multi-arch index digest of the upstream image (specs/041-wrapped-modules-live/research.md).
  digest: sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
  pullPolicy: IfNotPresent
service:
  port: 8080
ingress:
  enabled: true
  host: ""                 # supplied by can-core
  tls: true                # false on local dev (plain HTTP, no certificate resolver)
  certResolver: letsencrypt
  adapterRoutes: []
settings: {}               # module settings from company.yaml (admin_email)
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  mountPath: /data         # goatcounter.sqlite3
resources:
  requests: { memory: 48Mi, cpu: 10m }
  limits: { memory: 128Mi }
goMemLimit: 64MiB          # soft Go heap limit
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
secrets:
  database: can-db         # unused (SQLite)
  smtp: can-smtp           # unused: GoatCounter sends no mail by default
  module: can-module       # CAN_ANALYTICS_ADMIN_PASSWORD (generated once by can-core)
probes:
  readiness: { path: /status, port: http }
  liveness: { path: /status, port: http }
adapter:
  enabled: false           # needs the can-adapter-analytics image (deferred, see tasks.md)
  port: 8081
  image:
    repository: ghcr.io/dodwmd/can-adapter-analytics
    tag: 0.1.0
    digest: sha256:REPLACE_WITH_DIGEST
  env: {}
  resources:
    requests: { memory: 6Mi, cpu: 5m }
    limits: { memory: 32Mi }
