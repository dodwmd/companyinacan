# Analytics: GoatCounter (Go, EUPL-1.2) wrapped behind the `analytics` capability.
schema: 1
id: analytics
name: Analytics
description: Cookie-free, privacy-friendly web analytics for the company site. Wraps GoatCounter on SQLite (chosen over Umami for footprint, see specs/007-starter-modules/research.md); an adapter exposes the analytics capability.
category: marketing
# Experimental: installed through can-core on k3d by the advisory CI job (specs/041-wrapped-modules-live);
# never on a real server or domain, backups not run (the hooks image is not published), and the
# `analytics` capability adapter is not built (T032).
status: experimental
version: 0.1.0
provider:
  type: oss-wrapper
  name: GoatCounter
  # EUPL-1.2 is network copyleft: see modules/README.md. We run GoatCounter unmodified.
  licence: EUPL-1.2
  licence_class: osi
  upstream: https://github.com/arp242/goatcounter
  upstream_version: "2.7.0"
runtime:
  chart: ./chart
  values: ./chart/values.yaml
  subdomain: stats
  ui: { service: analytics, port: 8080 }
requires:
  database: sqlite
  sso: none
resources:
  # Measured 41 to 65 MB idle with the embedded GeoIP database (specs/041-wrapped-modules-live/research.md),
  # far above the 20 MB estimate of SPEC.md section 6.1. The unbuilt adapter (6 MB) is inside this figure.
  ram_mb: 64
  ram_limit_mb: 160
  disk_mb: 1024
# status: planned = the adapter is not built yet (T032); ignored by the registry. Keep in step with chart adapter.enabled.
provides:
  - { capability: analytics, schema: analytics.v1, service: analytics-adapter, port: 8081, status: planned }
permissions: [analytics.read, analytics.admin]
roles:
  viewer: [analytics.read]
  admin: [analytics.read, analytics.admin]
data_classes:
  # Aggregated page views without cookies or stored IP addresses: not personal data in the usual
  # sense, still bounded so the database stays small.
  - { class: pageview-aggregate, retention: 3y, sensitivity: standard }
settings_schema: ./settings.schema.json
hooks:
  # can-core dumps and restores this module itself (specs/046-wrapped-backups).
  backup: backup
  restore: restore
  builtin: {sqlite: goatcounter.sqlite3}
healthcheck: /status
