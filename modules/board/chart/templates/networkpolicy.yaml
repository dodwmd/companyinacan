{{- /*
The module namespace already carries default-deny plus the allows for Traefik, can-core, DNS and,
only with runtime.internet_egress, the internet (deploy/templates/module-namespace.yaml). With a single pod nothing more is needed, so
this is off by default. When a second pod of the release has to talk to this one, switch it on: it
allows exactly this release's pods to reach each other and nothing else (the installer refuses any
other peer, any port-less allow-all and any other namespace).
*/ -}}
{{- if .Values.networkPolicy.intraNamespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mod.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mod.selector" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "mod.selector" . | nindent 14 }}
{{- end }}
