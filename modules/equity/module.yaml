# Equity: in-house Go service (cmd/can-equity, library core/equity). Legal entities, share classes, option plans and
# pools, stakeholders, option grants with vesting, exercises, an append-only share ledger, cap-table views as of any
# date, valuation records and illustrative round modelling. "Stock" here means employee stock options and equity, not
# inventory. Equity is a sensitive data class (constitution V, SPEC.md sections 3.7 and 5): in-house only, per-field
# access control, audited reads, sealed sensitive fields, retention, legal hold and erasure.
# THIS IS A TOOL, NOT LEGAL, TAX OR SECURITIES ADVICE. 409A, ISO/NSO limits, tax treatment, 83(b) and ESOP scheme
# rules are not implemented; they are data fields and documented limits (docs/equity.md).
schema: 1
id: equity
name: Equity and cap table
description: Cap table and employee stock options. Entities, share classes, plans and pools, stakeholders, option grants with a vesting calculator, board approval with separation of duties, exercises, an append-only share ledger, cap-table views as of any date (basic and fully diluted), valuation records and illustrative round modelling. Per-field access, audited reads, sealed sensitive fields, retention, legal hold and erasure. Record-keeping and reporting only.
category: finance
# 0.3.0: the equity.board permission (specs/068-equity-board-role); the upgrade is held for the operator's
# approval because the board role gains it. 0.2.0: the web UI (specs/066-equity-ui).
version: 0.3.0
# experimental: unit-, contract- and race-tested offline. The chart installs through can-core, which
# generates the keyring and tokens (CI only waits for Ready on k3d). A server-rendered web UI (E17g,
# specs/066-equity-ui) ships in the same binary, off by default (ui.enabled), routed only with expose.ui, checked
# against the Compose stack and not on a cluster. can-core's tokens and Apps sign-ins carry the board role to holders
# of equity:board (directory identity mode only). The approval engine and events are not wired. See
# modules/equity/README.md.
status: experimental
provider:
  type: inhouse
  name: can-equity
runtime:
  chart: ./chart
  values: ./chart/values.yaml
  # The web UI accepts can-core launch tickets (specs/036-module-ui-sso).
  web_login: {}
  # Routed on equity.<domain> only when company.yaml sets modules.equity.expose.ui (specs/040-module-routing).
  # An allowlist of the web UI's own paths (/v1 is not one); test/contract checks it covers every UI route.
  public_ui:
    service: equity-api
    port: 8081
    exact: [/, /manifest.webmanifest]
    prefixes: [/company, /login, /logout, /me, /static]
    config:
      ui: { enabled: true, trust_proxy: true }
requires:
  database: sqlite
  sso: none
resources:
  # Idle RAM target 16 MB like the sibling in-house services; the measured figure is recorded in the README.
  ram_mb: 16
  ram_limit_mb: 64
  disk_mb: 200
provides:
  - { capability: equity, schema: equity.v1, service: equity-api, port: 8081 }
  - { capability: summary, schema: summary.v1, service: equity-api, port: 8081 }   # aggregates for the business overview
# Only with company.yaml modules.equity.settings.identity: directory (and the people module enabled)
# does can-core connect equity to the directory for the verified holder identity mode; otherwise
# attestation mode (specs/057-module-capability-wiring).
consumes: [directory]
publishes:
  # ids and dates only: never names, quantities or prices
  - { event: equity.grant.approved.v1, schema: ./events/equity.grant.approved.v1.json }
  - { event: equity.grant.vested.v1, schema: ./events/equity.grant.vested.v1.json }
  - { event: equity.exercise.recorded.v1, schema: ./events/equity.exercise.recorded.v1.json }
# Coarse permissions gate the capability verbs; the finer rules (own record only, managers never, board approval,
# separation of duties, per field) are enforced inside the service by one policy layer (core/equity/policy.go).
# equity.board is the board's own: only the board role holds it, so assigning equity:board is the one way to
# let somebody approve grants. Because the grant approval names the board, only an owner (or a holder of
# equity:board) can assign that role in can-core.
permissions: [equity.read, equity.write, equity.approve, equity.sensitive-read, equity.admin, equity.self-read, equity.board]
roles:
  employee: [equity.self-read]
  manager: [equity.self-read]   # a manager never sees the equity of their reports: same as employee
  hr: [equity.read, equity.write, equity.sensitive-read, equity.self-read]
  finance: [equity.read, equity.write, equity.approve, equity.sensitive-read]
  board: [equity.read, equity.approve, equity.sensitive-read, equity.admin, equity.board]
  admin: [equity.read, equity.write, equity.approve, equity.sensitive-read, equity.admin]
approvals:
  - { type: grant, default_chain: [board] }
  - { type: exercise, default_chain: [finance] }
data_classes:
  # Issued shares, transfers, exercises, grant terms and convertibles: the legal record. Legal retention overrides
  # erasure; rows refer to stakeholders by opaque id only.
  - { class: equity-ledger, retention: legal, sensitivity: sensitive }
  # Holder identity: name, email, tax id, directory person link. Sealed per field; erasure pseudonymises it.
  - { class: equity-stakeholder, retention: 7y, sensitivity: sensitive }
  # Free-form grant notes, exercise payment references, draft grants.
  - { class: equity-grants, retention: 7y, sensitivity: sensitive }
  # 409A and other valuation records (price and notes sealed).
  - { class: equity-valuation, retention: 7y, sensitivity: sensitive }
  # Append-only, hash-chained audit trail: ids and field names only.
  - { class: equity-audit, retention: legal, sensitivity: standard }
settings_schema: ./settings.schema.json
# `can-equity backup` and `restore`, run by can-core in this module's own image (specs/043-module-backup-hooks).
hooks:
  command: /can-equity
  backup: backup
  restore: restore
healthcheck: /healthz
