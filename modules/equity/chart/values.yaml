# Default values for the equity module chart. The chart templates are delivered with the module deployment
# epic (E03); this file fixes the contract the service expects, as for people and finance.
image:
  repository: ghcr.io/dodwmd/can-equity
  # Pinned by digest at release time; see deploy/equity/README.md.
  digest: ""
service:
  api: { name: equity-api, port: 8081 }  # ClusterIP only: the `equity` capability. No public listener, no ingress.
persistence:
  size: 200Mi
  mountPath: /data
resources:
  requests: { memory: 16Mi, cpu: 5m }
  limits: { memory: 64Mi }
config:
  # Mounted at /etc/can-equity/equity.yaml. keyring_file points at the mounted Secret below.
  keyring_file: /etc/can-equity/keys/keyring
  retention: {}   # override per data class, see modules/equity/settings.schema.json (the ledger and audit trail stay `legal`)
  introspect:
    url: ""       # can-core token introspection (resolves user tokens to subject, roles and person id); empty = service account only. https or loopback unless:
    allow_insecure_http: false
  webhook:
    url: ""       # can-core event endpoint for the outbox; empty = events stay in the outbox
secrets:
  # Names only; the values are created by can-core and never appear in values or git.
  env:
    - CAN_EQUITY_API_TOKEN          # service account (hr, finance, admin; never board) used by can-core
    - CAN_EQUITY_WEBHOOK_SECRET
    - CAN_EQUITY_INTROSPECT_TOKEN
  keyring:
    secretName: can-equity-keys     # one key `keyring`: lines of `<key-id> <64 hex>`, newest first; mounted 0400
    key: keyring
    mountPath: /etc/can-equity/keys
    subPath: keyring                # mount the single key with subPath: the loader refuses symlinks (Secret volumes use ..data links)
probes:
  readiness: { path: /healthz, port: 8081 }
  liveness: { exec: [/can-equity, healthcheck, -addr, "127.0.0.1:8081"] }
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
networkPolicy:
  # Default deny; ingress only from can-core and from the modules that consume the equity capability
  # (labelled by can-core when they declare it). Egress only to can-core.
  ingressFromCapabilityConsumers: true
