# Values for the equity module chart (in-house can-equity, SQLite). Rendered by can-core's installer.
# Secrets are not values: can-core puts the tokens named below and the sealed-field `keyring` (all
# generated once) and the can-core API settings into the can-module Secret, which every container
# receives as environment. No ingress of its own: can-core routes the web UI's paths only with
# company.yaml modules.equity.expose.ui.
image:
  repository: ghcr.io/dodwmd/can-equity
  tag: 0.3.0
  # Set to a sha256 digest at release time; empty = the tag.
  digest: ""
  pullPolicy: IfNotPresent
ports:
  - { name: api, port: 8081 }
services:                  # ClusterIP only; the `equity` capability
  - { name: equity-api, portName: api, port: 8081 }
ingress:                   # never routed
  enabled: false
  host: ""
  tls: true
  certResolver: letsencrypt
  service: equity-api
  port: 8081
  pathPrefixes: []
  paths: []
persistence:
  enabled: true
  size: 200Mi
  storageClass: ""
  mountPath: /data
configMountPath: /etc/can-equity-config
# Written verbatim to equity.yaml; only keys the can-equity config accepts. webhook.url stays unset: this
# service has no can-core client yet, so its events stay in its outbox.
config:
  keyring_file: /etc/can-equity/keys/keyring
  # The web UI (specs/066-equity-ui) is off; can-core switches it on (ui.enabled) while it is routed.
  retention: {}            # override per data class, see modules/equity/settings.schema.json (the ledger and audit trail stay `legal`)
# End of a break-glass window (YYYY-MM-DD inclusive, UTC, or RFC 3339; at most 7 days ahead), empty
# for none. can-core sets it from company.yaml modules.equity.settings.break_glass_until.
breakGlassUntil: ""
keyring:
  enabled: true            # can-core generates it once into the can-module Secret (key `keyring`)
  mountPath: /etc/can-equity/keys/keyring
  # 0440 with fsGroup: kubelet makes the file root:65532 group-readable.
  mode: 288
secrets:
  # Names only; the values are created by can-core and never appear in values or git.
  env:
    - CAN_EQUITY_API_TOKEN          # service account (hr, finance, admin; never board) used by can-core
  keyring:
    secretName: can-module
    key: keyring
    mountPath: /etc/can-equity/keys
    subPath: keyring       # a single key mounted with subPath: the loader refuses symlinks
resources:
  requests: { memory: 16Mi, cpu: 5m }
  limits: { memory: 64Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
probes:
  readiness: { path: /readyz, port: api }
  liveness: { exec: [/can-equity, healthcheck, -addr, "127.0.0.1:8081"] }
networkPolicy:
  intraNamespace: false
