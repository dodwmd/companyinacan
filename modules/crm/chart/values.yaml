# Values for the crm module chart (EspoCRM + MariaDB). can-core supplies ingress.host
# (<subdomain>.<domain>); see specs/007-starter-modules/contracts/module-charts.md for the Secret key contract.
image:
  # Docker Official Image `espocrm` (the espocrm/espocrm repository is marked LEGACY on Docker Hub).
  # Unverified here: the official image serves Apache on port 80 and its README does not say which user
  # runs it, so it may be rejected by the `restricted` profile (README "Open items"). The README shows
  # tags such as `<version>-apache`; resolve the release tag when pinning.
  repository: docker.io/library/espocrm
  tag: REPLACE_WITH_TAG    # unverified offline: pick a <version>-apache tag when pinning (README)
  # Pinned by digest at release time; `make release-check` fails while this placeholder remains.
  digest: sha256:REPLACE_WITH_DIGEST
  pullPolicy: IfNotPresent
service:
  port: 80                 # the image listens on 80; a non-root wrapper may move it (README)
ingress:
  enabled: true
  host: ""                 # supplied by can-core
  tls: true                # false on local dev (plain HTTP, no certificate resolver)
  certResolver: letsencrypt
  adapterRoutes: []        # none: lead.created.v1 reaches the adapter in-cluster from can-core
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  mountPath: /var/www/html # data/, custom/ and client/custom/ are mounted from this volume by subPath
resources:
  requests: { memory: 208Mi, cpu: 50m }
  limits: { memory: 384Mi }
daemon:
  # The scheduled-job daemon (the image's docker-daemon.sh): mail fetch, workflows, reminders.
  # Runs in the same pod and shares the volume (ReadWriteOnce).
  enabled: true
  resources:
    requests: { memory: 96Mi, cpu: 10m }
    limits: { memory: 160Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 33            # www-data in the Debian-based image (unverified)
  runAsGroup: 33
  fsGroup: 33
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
secrets:
  database: can-database   # keys: host port name user password
  smtp: can-smtp           # keys: host port user password from encryption (entered in the admin UI)
  module: can-module       # keys: api-url webhook-secret admin-user admin-password admin-email
probes:
  readiness: { path: /, port: http }
  liveness: { path: /, port: http }
  startup: { path: /, port: http, failureThreshold: 60, periodSeconds: 5 }   # first boot installs the schema
adapter:
  enabled: false           # needs the can-adapter-crm image (deferred, see tasks.md)
  port: 8081
  image:
    repository: ghcr.io/dodwmd/can-adapter-crm
    tag: 0.1.0
    digest: sha256:REPLACE_WITH_DIGEST
  env: {}
  resources:
    requests: { memory: 40Mi, cpu: 5m }
    limits: { memory: 96Mi }
