# Values for the jobs module chart (in-house can-jobs, SQLite). Rendered by can-core's installer.
# Secrets are not values: can-core puts CAN_JOBS_ADMIN_TOKEN, CAN_JOBS_HASH_KEY, CAN_JOBS_FORM_SECRET
# and the sealed-field `keyring` (all generated once) and the can-core API settings into the
# can-module Secret, which every container receives as environment.
image:
  repository: ghcr.io/dodwmd/can-jobs
  tag: 0.1.0
  # Pinned by digest at release time; `make release-check` fails while this placeholder remains.
  digest: sha256:REPLACE_WITH_DIGEST
  pullPolicy: IfNotPresent
ports:
  - { name: http, port: 8080 }
services:                  # ClusterIP only; the `jobs` and `ats` capabilities
  - { name: jobs, portName: http, port: 8080 }
ingress:
  # Only the public careers pages are routed, and only when the manifest declares
  # runtime.subdomain (host <subdomain>.<domain>, supplied by can-core). /v1 stays cluster-internal.
  enabled: true
  host: ""
  tls: true
  certResolver: letsencrypt
  service: jobs
  port: 8080
  pathPrefixes: [/careers, /feeds]
  paths: [/robots.txt]
persistence:
  enabled: true
  size: 1Gi                # database and resume files
  storageClass: ""
  mountPath: /data
configMountPath: /etc/can-jobs-config
# Written verbatim to jobs.yaml; only keys core/jobs Config accepts. No webhook.url: events reach
# other modules through can-core (POST /v1/events on the module API).
config:
  listen: ":8080"
  db_path: /data/jobs.db
  resume_dir: /data/resumes
  keyring_path: /etc/can-jobs/keyring
  trust_proxy: false       # turn on only behind a proxy that appends the client address
  company: { name: "", base_url: "" }   # set both: absolute URLs in JSON-LD, feeds and the sitemap
  rate_limit: { per_minute: 600, auth_failures_per_minute: 30, apply_per_hour: 10, max_tracked: 10000 }
  apply:
    max_resume_bytes: 5242880
    collect_eeo: false
    captcha_provider: ""
    scanner_required: true # no resume upload is accepted until a real virus scanner is wired in
  approval: { required: false }
keyring:
  enabled: true            # can-core generates it once into the can-module Secret (key `keyring`)
  mountPath: /etc/can-jobs/keyring
  # 0440 with fsGroup: kubelet makes the file root:65532 group-readable. See modules/jobs/chart/README.md.
  mode: 288
resources:
  requests: { memory: 30Mi, cpu: 5m }
  limits: { memory: 64Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
probes:
  readiness: { path: /healthz, port: http }
  liveness: { exec: [/can-jobs, healthcheck, -addr, "127.0.0.1:8080"] }
networkPolicy:
  intraNamespace: false
