apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mod.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mod.selector" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.adapter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-adapter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mod.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mod.selector" . | nindent 4 }}
    app.kubernetes.io/component: adapter
  ports:
    - name: http
      port: {{ .Values.adapter.port }}
      targetPort: http
{{- end }}
