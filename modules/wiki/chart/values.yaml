# Values for the wiki module chart (DokuWiki, flat files, no database). can-core supplies
# ingress.host (<subdomain>.<domain>); see specs/007-starter-modules/contracts/module-charts.md.
image:
  # Official DokuWiki image (Docker Hub dokuwiki/dokuwiki, built on the PHP Apache image). Its README
  # documents port 8080, the /storage volume and running as a non-root uid (`--user 1000:1000`).
  # `stable` is a floating upstream tag: pin a dated tag and the digest when releasing (README).
  repository: docker.io/dokuwiki/dokuwiki
  tag: stable
  # Pinned by digest at release time; `make release-check` fails while this placeholder remains.
  digest: sha256:REPLACE_WITH_DIGEST
  pullPolicy: IfNotPresent
service:
  port: 8080
ingress:
  enabled: true
  host: ""                 # supplied by can-core
  tls: true                # false on local dev (plain HTTP, no certificate resolver)
  certResolver: letsencrypt
  adapterRoutes: []
app:
  phpMemoryLimit: 128M     # image default is 256M; a small wiki does not need it
  phpUploadLimit: 16M
  timezone: UTC
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  mountPath: /storage      # pages, media, config, plugins
resources:
  requests: { memory: 56Mi, cpu: 20m }
  limits: { memory: 128Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
secrets:
  database: can-database   # unused (flat files); kept so every wrapped chart has the same contract
  smtp: can-smtp           # unused: DokuWiki mail settings are manual (README)
  module: can-module       # keys: api-url webhook-secret admin-user admin-password admin-email
probes:
  readiness: { path: /doku.php, port: http }
  liveness: { path: /doku.php, port: http }
adapter:
  enabled: false           # needs the can-adapter-wiki image (deferred, see tasks.md)
  port: 8081
  image:
    repository: ghcr.io/dodwmd/can-adapter-wiki
    tag: 0.1.0
    digest: sha256:REPLACE_WITH_DIGEST
  env: {}
  resources:
    requests: { memory: 8Mi, cpu: 5m }
    limits: { memory: 32Mi }
