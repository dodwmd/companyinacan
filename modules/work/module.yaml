# Work tracker: in-house Go service (cmd/can-work, library core/work), a lean Jira-style
# tracker with an API first. A Plane wrapper for 8 GB+ servers is a later, separate module
# that provides the same `work` capability (SPEC.md section 6.1).
schema: 1
id: work
name: Work tracker
description: API-first issue tracker. Projects, epics, stories, tasks, bugs and subtasks, P0 to P3 priorities, configurable workflows, sprints and boards, comments, links, watchers and an activity log. Scoped API tokens for people and service accounts, idempotent creates, signed webhook events, and the work and projects capabilities.
category: operations
# experimental: the service and its tests are complete and measured locally, and the chart installs
# through can-core's installer in unit tests (specs/016-module-wiring); the advisory dev-cluster CI
# job builds the image and installs work through can-core (see docs/module-wiring.md for what that
# proves). `can validate` warns so it is not offered as enable-ready until that is checked.
status: experimental
version: 0.1.0
provider:
  type: inhouse
  name: can-work
runtime:
  chart: ./chart
  values: ./chart/values.yaml
  # The web UI accepts can-core launch tickets (specs/036-module-ui-sso).
  web_login: { base_path: /ui }
  # Routed on work.<domain> only when company.yaml sets modules.work.expose.ui (specs/040-module-routing).
  public_ui:
    service: work
    port: 8080
    exact: [/]
    prefixes: [/ui]
    config:
      trust_proxy: true # the client address Traefik appends
      ui: { force_secure: true }
requires:
  database: sqlite
  sso: none
resources:
  # Declared 28 MB, limit 64 MB. Measured on the static linux/amd64 build (specs/023-work-ui/plan.md):
  # 16.6 MiB RSS idle with the web UI (13.4 MiB without), 27.7 MiB after 400 UI list and board
  # renders over 50 issues, 31.0 MiB after 30 renders of a 50 KB description with 30 comments of
  # 19 KB. The API alone needed 20.4 MiB under load (research.md R7). The limit leaves room for
  # bursts and the SQLite page cache.
  ram_mb: 28
  ram_limit_mb: 64
  disk_mb: 500
provides:
  - { capability: work, schema: work.v1, service: work, port: 8080 }
  - { capability: projects, schema: projects.v1, service: work, port: 8080 }
  - { capability: summary, schema: summary.v1, service: work, port: 8080 }   # aggregates for the business overview
publishes:
  - { event: work.issue.created.v1, schema: ./events/work.issue.created.v1.json }
  - { event: work.issue.updated.v1, schema: ./events/work.issue.updated.v1.json }
  - { event: work.issue.transitioned.v1, schema: ./events/work.issue.transitioned.v1.json }
  - { event: work.comment.created.v1, schema: ./events/work.comment.created.v1.json }
permissions: [work.read, work.write, work.admin]
roles:
  member: [work.read, work.write]
  viewer: [work.read]
  manager: [work.read, work.write]
  admin: [work.read, work.write, work.admin]
data_classes:
  # Titles, descriptions, comments and assignees. Internal business content and the names of
  # employees (personal data), but no health, financial or identity-document data, so standard.
  # Retention counts from resolution: resolved issues are deleted after the period. Open issues
  # are kept. The default matches 5 years (core/work Config.RetentionDays).
  # The personal data is the identifiers people appear under (reporter, assignee, comment author,
  # activity actor, watcher, token subject) and whatever texts mention. Erasing a person replaces the
  # identifier with a pseudonym (POST /v1/people/erase), writes a tombstone of this class
  # (GET /v1/erasures) and is replayed by a restore with `can-work purge`.
  - { class: work-issue, retention: 5y, sensitivity: standard }
  # Admin actions (token and project changes). Never holds secrets.
  - { class: work-audit, retention: 7y, sensitivity: standard }
  # Attachment metadata only (name, size, hash, link); the tracker stores no file bytes yet.
  - { class: work-attachment-metadata, retention: 5y, sensitivity: standard }
settings_schema: ./settings.schema.json
# `can-work backup` and `restore`, run by can-core in this module's own image (specs/043-module-backup-hooks).
hooks:
  command: /can-work
  backup: backup
  restore: restore
healthcheck: /healthz
