# Values for the work module chart (in-house can-work, SQLite). Rendered by can-core's installer;
# see specs/016-module-wiring/contracts/module-charts.md. Secrets are not values: can-core puts
# CAN_WORK_ADMIN_TOKEN (generated once) and the can-core API settings into the can-module Secret,
# which every container receives as environment.
image:
  repository: ghcr.io/dodwmd/can-work
  tag: 0.2.0
  # Pinned by digest at release time; `make release-check` fails while this placeholder remains.
  digest: sha256:REPLACE_WITH_DIGEST
  pullPolicy: IfNotPresent
ports:
  - { name: http, port: 8080 }
services:                  # ClusterIP only; the `work` and `projects` capabilities
  - { name: work, portName: http, port: 8080 }
ingress:                   # work has no public site: no manifest subdomain, so nothing is routed
  enabled: false
  host: ""                 # supplied by can-core, only for a module with runtime.subdomain
  tls: true
  certResolver: letsencrypt
  service: work
  port: 8080
  pathPrefixes: []
  paths: []
persistence:
  enabled: true
  size: 500Mi
  storageClass: ""
  mountPath: /data         # work.db
configMountPath: /etc/can-work-config
# Written verbatim to work.yaml; only keys core/work Config accepts. No webhook.url: events reach
# other modules through can-core (POST /v1/events on the module API).
config:
  listen: ":8080"
  db_path: /data/work.db
  trust_proxy: false       # turn on only behind a proxy that appends the client address
  rate_limit:
    per_minute: 600
    auth_failures_per_minute: 30
    max_tracked: 10000
  retention_days: 1825
keyring:
  enabled: false
resources:
  requests: { memory: 28Mi, cpu: 5m }
  limits: { memory: 64Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
probes:
  readiness: { path: /readyz, port: http }
  liveness: { exec: [/can-work, healthcheck, -addr, "127.0.0.1:8080"] }
networkPolicy:
  intraNamespace: false    # one pod: the namespace's base policies are enough
