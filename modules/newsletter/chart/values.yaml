# Values for the newsletter module chart (Listmonk). can-core supplies ingress.host
# (<subdomain>.<domain>); see specs/007-starter-modules/contracts/module-charts.md.
image:
  repository: docker.io/listmonk/listmonk
  tag: v6.2.0
  # Multi-arch index digest of the upstream image (specs/041-wrapped-modules-live/research.md).
  digest: sha256:f535d59e14991337a9f2d570273685378ae86b0d7698c3e00da444e3bc205286
  pullPolicy: IfNotPresent
service:
  port: 9000
ingress:
  enabled: true
  host: ""                 # supplied by can-core
  tls: true                # false on local dev (plain HTTP, no certificate resolver)
  certResolver: letsencrypt
  adapterRoutes: []
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  mountPath: /listmonk/uploads   # media uploaded to campaigns
database:
  sslMode: disable         # in-cluster connection to the shared Postgres in can-data
resources:
  requests: { memory: 40Mi, cpu: 20m }
  limits: { memory: 96Mi }
migrateResources:          # runs before the app starts, so it does not add to steady state
  requests: { memory: 32Mi, cpu: 20m }
  limits: { memory: 96Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
secrets:
  database: can-db         # DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
  smtp: can-smtp           # bulk relay credentials; applied through the Listmonk API, not env (README)
  module: can-module       # CAN_NEWSLETTER_ADMIN_PASSWORD (generated once by can-core)
adminUser: admin           # login of the first Listmonk super admin
probes:
  readiness: { path: /health, port: http }
  liveness: { path: /health, port: http }
adapter:
  enabled: false           # needs the can-adapter-newsletter image (deferred, see tasks.md)
  port: 8081
  image:
    repository: ghcr.io/dodwmd/can-adapter-newsletter
    tag: 0.1.0
    digest: sha256:REPLACE_WITH_DIGEST
  env: {}
  resources:
    requests: { memory: 10Mi, cpu: 5m }
    limits: { memory: 32Mi }
