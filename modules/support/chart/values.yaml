# Values for the support module chart (FreeScout). can-core supplies ingress.host
# (<subdomain>.<domain>) and may override anything below from the module's settings.
# See specs/007-starter-modules/contracts/module-charts.md for the Secret key contract.
image:
  # FreeScout publishes no image. This one is built by PikaPods (a hosting company) from the upstream
  # release on serversideup/php, runs as www-data (uid 82) and listens on 8080, so it satisfies the
  # `restricted` profile (specs/041-wrapped-modules-live/research.md).
  repository: docker.io/pikapods/docker-freescout
  tag: "1.8.252-r2"
  digest: sha256:fcb46451971ae10046e4008f036203f64fd0dc6f637cfd45ab0c9ee31ccdebfa
  pullPolicy: IfNotPresent
service:
  port: 8080
ingress:
  enabled: true
  host: ""                 # supplied by can-core
  tls: true                # false on local dev (plain HTTP, no certificate resolver)
  certResolver: letsencrypt
  adapterRoutes:           # public paths served by the adapter (inbound-parse webhook)
    - { pathPrefix: /inbound, priority: 100, inboundMode: webhook }   # only in webhook mode
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  mountPath: /data         # attachments, uploaded modules, logs
settings: {}               # module settings from company.yaml (docs/support.md)
resources:
  requests: { memory: 176Mi, cpu: 50m }
  limits: { memory: 640Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 82
  runAsGroup: 82
  fsGroup: 82
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
# Names of the Secrets can-core creates in the module namespace.
secrets:
  database: can-db         # DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
  smtp: can-smtp           # host port user password from encryption; empty without a relay
  imap: can-imap           # host port user password encryption folder verify; empty without inbound mail
  module: can-module       # CAN_SUPPORT_ADMIN_PASSWORD (generated once by can-core)
probes:
  # /healthcheck is answered by nginx alone; /login only once the first-boot migrations are done.
  readiness: { path: /login, port: http }
  liveness: { path: /healthcheck, port: http }
  startup: { path: /login, port: http, failureThreshold: 90, periodSeconds: 5 }   # first boot runs migrations
app:
  applicationName: Support
  phpMaxChildren: 6        # PHP-FPM workers (on demand)
email:
  injectRelay: true        # give FreeScout the company's SMTP relay (system mail and the support mailbox)
inbound:
  mode: imap               # imap | webhook (a setting of the module, docs/email-policy.md)
adapter:
  enabled: false           # needs the can-adapter-support image (deferred, see tasks.md)
  port: 8081
  image:
    repository: ghcr.io/dodwmd/can-adapter-support
    tag: 0.1.0
    digest: sha256:REPLACE_WITH_DIGEST
  env: {}
  resources:
    requests: { memory: 10Mi, cpu: 5m }
    limits: { memory: 32Mi }
