# Support inbox: FreeScout (PHP, AGPL-3.0) wrapped behind the `tickets` capability.
schema: 1
id: support
name: Support inbox
description: Shared support inbox with email in and out, assignment and canned replies. Wraps FreeScout; an adapter exposes the tickets capability and the ticket.created.v1 event. Inbound mail arrives over IMAP or an inbound-parse webhook (docs/email-policy.md).
category: support
# Experimental: installed through can-core on k3d by the advisory CI job (specs/041-wrapped-modules-live);
# never on a real server, domain or SMTP relay; inbound mail is configured by hand; backups are not run
# (the hooks image is not published); the `tickets` adapter is not built (T030). The image is a third
# party build of FreeScout (PikaPods).
status: experimental
version: 0.1.0
provider:
  type: oss-wrapper
  name: FreeScout
  # AGPL-3.0 is network copyleft: see modules/README.md. We run FreeScout unmodified.
  licence: AGPL-3.0-only
  licence_class: osi
  upstream: https://github.com/freescout-help-desk/freescout
  upstream_version: "1.8.252"
runtime:
  chart: ./chart
  values: ./chart/values.yaml
  subdomain: support
  ui: { service: support, port: 8080 }
requires:
  database: postgres
  capabilities: [email.send]
  sso: none
resources:
  # Measured 90 to 115 MB idle locally, 150 MB peak while migrating (specs/041-wrapped-modules-live/research.md),
  # not counting the shared Postgres. The unbuilt adapter (10 MB request) is inside this figure.
  ram_mb: 192
  ram_limit_mb: 672
  disk_mb: 2048
# status: planned = the adapter that serves the capability is not built yet (T030); the registry,
# provider resolution and event routing ignore planned entries. Keep in step with chart adapter.enabled.
provides:
  - { capability: tickets, schema: tickets.v1, service: support-adapter, port: 8081, status: planned }
publishes:
  - { event: ticket.created.v1, schema: ./events/ticket.created.v1.json }
permissions: [tickets.read, tickets.write, tickets.admin]
roles:
  agent: [tickets.read, tickets.write]
  viewer: [tickets.read]
  admin: [tickets.read, tickets.write, tickets.admin]
data_classes:
  # Customer messages and attachments: personal data, standard sensitivity. Three years covers
  # the usual dispute and warranty window; shorten it in settings if the business allows.
  - { class: support-conversation, retention: 3y, sensitivity: standard }
  - { class: support-attachment, retention: 3y, sensitivity: standard }
settings_schema: ./settings.schema.json
hooks:
  # The upstream image has neither curl nor the MariaDB client; see deploy/hooks/.
  image: ghcr.io/dodwmd/can-hooks:0.1.0
  backup: ./hooks/backup.sh
  restore: ./hooks/restore.sh
healthcheck: /healthcheck
