# Values for the people module chart (in-house can-people, SQLite). Rendered by can-core's
# installer. Secrets are not values: can-core puts CAN_PEOPLE_API_TOKEN and the sealed-field
# `keyring` (generated once) and the can-core API settings into the can-module Secret, which every
# container receives as environment. No public listener and no ingress.
image:
  repository: ghcr.io/dodwmd/can-people
  tag: 0.1.0
  # Pinned by digest at release time; `make release-check` fails while this placeholder remains.
  digest: sha256:REPLACE_WITH_DIGEST
  pullPolicy: IfNotPresent
ports:
  - { name: api, port: 8081 }
services:                  # ClusterIP only; the `directory` and `performance` capabilities
  - { name: people-api, portName: api, port: 8081 }
ingress:                   # never routed: people data is not public
  enabled: false
  host: ""
  tls: true
  certResolver: letsencrypt
  service: people-api
  port: 8081
  pathPrefixes: []
  paths: []
persistence:
  enabled: true
  size: 200Mi
  storageClass: ""
  mountPath: /data         # people.db
configMountPath: /etc/can-people-config
# Written verbatim to people.yaml; only keys core/people Config accepts. webhook.url stays empty:
# events reach other modules through can-core (POST /v1/events on the module API).
config:
  listen: ":8081"
  db_path: /data/people.db
  keyring_file: /etc/can-people/keys/keyring
  retention: {}            # per data class, see modules/people/settings.schema.json
keyring:
  enabled: true            # can-core generates it once into the can-module Secret (key `keyring`)
  mountPath: /etc/can-people/keys/keyring
  # 0440 with fsGroup: kubelet makes the file root:65532 group-readable. See modules/people/chart/README.md.
  mode: 288
resources:
  requests: { memory: 30Mi, cpu: 5m }
  limits: { memory: 64Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
probes:
  readiness: { path: /readyz, port: api }
  liveness: { exec: [/can-people, healthcheck, -addr, "127.0.0.1:8081"] }
networkPolicy:
  intraNamespace: false
