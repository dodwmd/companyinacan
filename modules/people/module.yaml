# People: in-house Go service (cmd/can-people, library core/people). It holds the directory
# (people records, org structure, employment lifecycle, onboarding/offboarding checklists) and
# performance data (1:1s, goals, review cycles with self, manager and 360 feedback, calibration and release)
# and time off (leave types with accrual policy as data, balances ledger, requests, holiday calendars). These are the most sensitive data classes the platform holds, so
# they live in an in-house module only: per-field access control, audited reads, field-level
# encryption at rest, retention, legal hold and erasure (SPEC.md sections 3.7 and 5, constitution V).
# This is a tool, not legal, HR or payroll advice; compliance is the operator's responsibility.
schema: 1
id: people
name: People and performance
description: Directory (people records, org chart, employment status with effective dating, onboarding and offboarding checklists), performance (1:1s with shared and private notes, goals and key results, review cycles with self, manager and anonymous peer feedback, calibration and approved release) and time off (leave types and accruals as data, balances ledger, requests approved by the manager, holiday calendars, team calendar showing only out). Per-field access control by role, audited sensitive reads, encrypted sensitive fields, retention, legal hold and erasure tombstones. Not payroll, and not legal or HR advice.
category: people
version: 0.2.0
# experimental: unit-, contract- and race-tested, and the chart installs through can-core's installer
# in unit tests (specs/016-module-wiring); not yet exercised on a cluster, no portal or admin UI.
# can-core generates the API token and the keyring, introspects personal access tokens and delivers
# the hire hand-off from jobs. See modules/people/README.md.
status: experimental
provider:
  type: inhouse
  name: can-people
runtime:
  chart: ./chart
  values: ./chart/values.yaml
requires:
  database: sqlite
  sso: none
resources:
  # Idle RAM target 30 MB (SPEC.md section 6.1, "~30 MB (target)"); measured idle RSS is recorded in
  # specs/012-people-directory/measurements.md and, with reviews and time off, in specs/022-reviews-timeoff/measurements.md. The limit leaves room for SQLite page cache and bursts.
  ram_mb: 30
  ram_limit_mb: 64
  disk_mb: 200
provides:
  - { capability: directory, schema: directory.v1, service: people-api, port: 8081 }
  - { capability: performance, schema: performance.v1, service: people-api, port: 8081 }
publishes:
  - { event: person.created.v1, schema: ./events/person.created.v1.json }
  # leave is masked as active in this event (see the schema description)
  - { event: person.status_changed.v1, schema: ./events/person.status_changed.v1.json }
  - { event: person.offboarded.v1, schema: ./events/person.offboarded.v1.json }
  - { event: person.erased.v1, schema: ./events/person.erased.v1.json }
  - { event: oneonone.scheduled.v1, schema: ./events/oneonone.scheduled.v1.json }
  - { event: goal.updated.v1, schema: ./events/goal.updated.v1.json }
  - { event: checklist.task_completed.v1, schema: ./events/checklist.task_completed.v1.json }
  - { event: review.cycle.opened.v1, schema: ./events/review.cycle.opened.v1.json }
  - { event: review.released.v1, schema: ./events/review.released.v1.json }
  # timeoff.* carry ids and dates only (never the leave type), but dates reveal absence: subscribe only the
  # modules that need them (for example timesheets); do not fan them out. See docs/people.md.
  - { event: timeoff.approved.v1, schema: ./events/timeoff.approved.v1.json }
  - { event: timeoff.cancelled.v1, schema: ./events/timeoff.cancelled.v1.json }
# The hire hand-off from jobs starts a person in onboarding (core/people/hire.go).
subscribes:
  - { event: candidate.hired.v1, service: people-api, port: 8081, webhook: /v1/can/events }
# Coarse permissions gate the capability verbs; the finer rules (self, manager chain, HR, admin, per field)
# are enforced inside the service by one policy layer (core/people/policy.go).
# Reviews and time off use distinctive, non-colliding names (people.reviews.*, people.timeoff.*).
permissions: [people.read, people.write, people.sensitive-read, people.sensitive-write, people.admin, performance.read, performance.write,
  people.reviews.read, people.reviews.write, people.reviews.admin, people.timeoff.read, people.timeoff.write, people.timeoff.approve, people.timeoff.admin]
roles:
  employee: [people.read, people.sensitive-read, people.sensitive-write, performance.read, performance.write, people.reviews.read, people.reviews.write, people.timeoff.read, people.timeoff.write]
  manager: [people.read, performance.read, performance.write, people.reviews.read, people.reviews.write, people.timeoff.read, people.timeoff.approve]
  hr: [people.read, people.write, people.sensitive-read, people.sensitive-write, people.admin, people.reviews.read, people.reviews.admin, people.timeoff.read, people.timeoff.approve, people.timeoff.admin]
  admin: [people.read, people.write, people.sensitive-read, people.sensitive-write, people.admin, people.reviews.read, people.reviews.admin, people.timeoff.read, people.timeoff.approve, people.timeoff.admin]
# Approval types this module registers with can-core's approval engine (E11a) when it is wired. `manager` resolves
# the requester's manager through the reporting line this module provides; the service applies its own
# separation-of-duties check on top of the engine's. Without the engine the service decides itself.
approvals:
  - { type: timeoff, default_chain: [manager] }
  - { type: review-release, default_chain: [hr] }
data_classes:
  # Basic directory fields: names, work email and phone, location, reporting line. Visible to colleagues
  # by role. Kept for the retention period after the person leaves, then purged unless a legal hold applies.
  - { class: directory-basic, retention: 7y, sensitivity: standard }
  # Date of birth, national id, home address, personal phone, compensation. Encrypted at rest per field,
  # every read audited, never in events, search or reports.
  - { class: people-sensitive, retention: 7y, sensitivity: sensitive }
  - { class: people-checklists, retention: 2y, sensitivity: standard }
  # 1:1 agendas, shared notes, manager-private notes, action items.
  - { class: performance-oneonone, retention: 2y, sensitivity: sensitive }
  # Goals, key results and progress updates.
  - { class: performance-goals, retention: 2y, sensitivity: sensitive }
  # Review content per person: self-assessment, manager review, ratings, calibration notes, feedback
  # given and received, acknowledgement. Sealed per field. Closed cycles expire by age.
  - { class: performance-reviews, retention: 2y, sensitivity: sensitive }
  # Leave requests and the balances ledger. Sick and parental leave can reveal health or family
  # circumstances: the class is sensitive, notes are sealed, and colleagues only ever see "out".
  - { class: people-timeoff, retention: 7y, sensitivity: sensitive }
settings_schema: ./settings.schema.json
healthcheck: /healthz
