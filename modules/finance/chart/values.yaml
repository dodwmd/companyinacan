# Values for the finance module chart (in-house can-finance, SQLite). Rendered by can-core's
# installer. Secrets are not values: can-core puts CAN_FINANCE_ADMIN_TOKEN and
# CAN_FINANCE_LINK_SECRET (generated once) and the can-core API settings into the can-module Secret,
# which every container receives as environment.
image:
  repository: ghcr.io/dodwmd/can-finance
  tag: 0.1.0
  # Pinned by digest at release time; `make release-check` fails while this placeholder remains.
  digest: sha256:REPLACE_WITH_DIGEST
  pullPolicy: IfNotPresent
ports:
  - { name: http, port: 8080 }
services:                  # ClusterIP only; the `invoices`, `contracts` and `timesheets` capabilities
  - { name: finance, portName: http, port: 8080 }
ingress:
  # The signed, expiring invoice view (/public/invoices/) could be routed from the internet, but
  # finance declares no runtime.subdomain, so can-core supplies no host and nothing is routed.
  enabled: false
  host: ""
  tls: true
  certResolver: letsencrypt
  service: finance
  port: 8080
  pathPrefixes: [/public/invoices/]
  paths: []
persistence:
  enabled: true
  size: 500Mi
  storageClass: ""
  mountPath: /data         # finance.db
configMountPath: /etc/can-finance-config
# Written verbatim to finance.yaml; only keys core/finance Config accepts. No webhook.url: events
# reach other modules through can-core (POST /v1/events on the module API).
config:
  listen: ":8080"
  db_path: /data/finance.db
  trust_proxy: false       # turn on only behind a proxy that appends the client address
  rate_limit:
    per_minute: 600
    auth_failures_per_minute: 30
    max_tracked: 10000
  base_currency: USD
  payment_provider: none
  esign_provider: none
  retention_years: 7
  audit_retention_days: 2555
  # Web UI (specs/031-finance-ui): off by default. To turn it on add `ui: { enabled: true, force_secure: true }` here
  # and route a host to the service; the UI needs TLS (Secure, __Host- cookies) and a subdomain, which this chart
  # does not provide yet (docs/finance-ui.md).
keyring:
  enabled: false
resources:
  requests: { memory: 20Mi, cpu: 5m }
  limits: { memory: 48Mi }
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
probes:
  readiness: { path: /healthz, port: http }
  liveness: { exec: [/can-finance, healthcheck, -addr, "127.0.0.1:8080"] }
networkPolicy:
  intraNamespace: false
