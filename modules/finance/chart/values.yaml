# Default values for the finance module chart. The chart templates are delivered with the module
# deployment work (E03/E07 pattern); this file fixes the contract the service expects.
image:
  repository: ghcr.io/dodwmd/can-finance
  # Pinned by digest at release time; see deploy/finance/README.md.
  digest: ""
service:
  api: { name: finance, port: 8080 }   # ClusterIP only; the `invoices`, `contracts` and `timesheets` capabilities
persistence:
  size: 500Mi
  mountPath: /data
resources:
  requests: { memory: 20Mi, cpu: 5m }
  limits: { memory: 48Mi }
config:
  # Mounted at /etc/can-finance/finance.yaml (see modules/finance/settings.schema.json).
  # Off by default: turn on only when a proxy that appends the client address fronts it.
  trust_proxy: false
  rate_limit_per_minute: 600
  base_currency: USD
  retention_years: 7
  payment_provider: none
  esign_provider: none
publicLink:
  # Only this path prefix may be routed from the internet (the signed, expiring invoice view).
  # Everything else stays cluster-internal.
  pathPrefix: /public/invoices/
env:
  # Names only; values come from the module Secret created by can-core.
  secretKeys:
    - CAN_FINANCE_ADMIN_TOKEN        # bootstrap token with every scope; mint day-to-day tokens with it
    - CAN_FINANCE_LINK_SECRET        # signs public invoice links (32+ characters)
    - CAN_FINANCE_WEBHOOK_SECRET     # only when webhook_url is set
    - CAN_FINANCE_PROVIDER_SECRET    # only with the fake providers (development)
probes:
  readiness: { path: /healthz, port: 8080 }
  liveness: { exec: [/can-finance, healthcheck, -addr, "127.0.0.1:8080"] }
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
