# Footprint variant "trimmed": the flags `make dev` uses (dev/k3d.yaml) apart from the host ports:
# metrics-server disabled, secrets encryption on. Traefik, CoreDNS, local-path, ServiceLB stay.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: fp-trimmed
image: rancher/k3s:v1.31.5-k3s1
servers: 1
agents: 0
options:
  k3d:
    wait: true
    timeout: 180s
  k3s:
    extraArgs:
      - arg: --disable=metrics-server
        nodeFilters: [server:*]
      - arg: --secrets-encryption
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
