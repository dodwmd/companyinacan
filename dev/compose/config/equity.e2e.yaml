# E2E ONLY (dev/compose/e2e.yml): the dev equity config plus token introspection against the
# introstub service, so the suite can act as HR and as a board member.
listen: ":8081"
db_path: /data/equity.db
keyring_file: /secrets/equity-keyring
introspect:
  url: http://introstub:8099/
  allow_insecure_http: true
ui:
  enabled: true
  insecure_cookies: true
  trust_proxy: true
