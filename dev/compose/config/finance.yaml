# DEV ONLY can-finance config for docker-compose.yml. Payment and e-sign providers are fakes.
listen: ":8080"
db_path: /data/finance.db
trust_proxy: true
base_currency: USD
payment_provider: fake
esign_provider: fake
public_base_url: http://finance.localhost:8080
# Signing contracts by emailed link (specs/049-contract-esign): the origin the links point at.
sign_base_url: http://finance.localhost:8080
seller:
  name: Acme Co
  address: 1 Anvil Road, Fakeville
# Web UI (specs/031-finance-ui), at http://finance.localhost:8080/. Plain HTTP in dev, so cookies are not Secure.
ui:
  enabled: true
  insecure_cookies: true
