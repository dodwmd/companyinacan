# DEV ONLY can-equity config for docker-compose.yml. The keyring is generated by the `init` service.
# No introspection endpoint: only the service-account token authenticates (roles hr, finance, admin; never board).
listen: ":8081"
db_path: /data/equity.db
keyring_file: /secrets/equity-keyring
# Web UI (specs/066-equity-ui), at http://equity.localhost:8080/. Plain HTTP in dev, so cookies are not Secure.
ui:
  enabled: true
  insecure_cookies: true
  trust_proxy: true
