# DEV ONLY can-jobs config for docker-compose.yml. The keyring is generated by the `init` service.
listen: ":8080"
db_path: /data/jobs.db
resume_dir: /data/resumes
keyring_path: /secrets/jobs-keyring
trust_proxy: true
company:
  name: Acme Co
  base_url: http://jobs.localhost:8080
apply:
  allowed_origins: ["http://jobs.localhost:8080"]
  scanner_required: false    # no virus scanner ships; dev accepts resumes unscanned
# Recruiting web UI (specs/027-jobs-ui), at http://jobs.localhost:8080/. Plain HTTP in dev, so cookies are not Secure.
ui:
  enabled: true
  insecure_cookies: true
