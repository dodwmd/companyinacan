# DEV ONLY can-files config for docker-compose.yml. The keyring is generated by the `init` service.
listen: ":8095"
db_path: /data/files.db
keyring_path: /secrets/files-keyring
staging_dir: /data/staging
trust_proxy: true
backend:
  type: local
  local: { dir: /data/blobs }
scanner:
  required: false    # no virus scanner ships and none is in the compose stack; dev stores files labelled "skipped"
share:
  base_url: http://files.localhost:8080
# Web UI (specs/049-files-ui), at http://files.localhost:8080/ (token sign-in) and http://localhost:8185/
# (from the admin UI's Apps page). Plain HTTP in dev, so cookies are not Secure.
ui:
  enabled: true
  insecure_cookies: true
